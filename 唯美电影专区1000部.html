  const mf = window.AESTHETIC1000_MANIFEST;
  const plist = mf && (Array.isArray(mf.pillars) ? mf.pillars : mf.shards);
  if (state.pid && Array.isArray(plist)) {
    const p = plist.find(s => s.code === state.pid);
    if (p) {
      noteEl.textContent = `${p.code} ${p.name}（${p.count} 部）：${p.desc}`;
      noteEl.hidden = false;
    }
  } else {
    noteEl.hidden = true;
  }

  filtered = ITEMS.filter(x => {
    if (state.pid && x.pid !== state.pid) return false;
    const btag = x.batch || 'B1';
    if (state.batch !== 'all' && btag !== state.batch) return false;
    if (state.cover === 'cover' && !x.cover) return false;
    if (state.bw === 'bw' && !x.bw) return false;
    if (state.bw === 'color' && x.bw) return false;
    if (kw) {
      if (!x._q) {
        const shotTxt = (x.shots || []).map(s => s.prompt + ' ' + s.analysis).join(' ');
        x._q = [x.aid, x.t, x.te, x.y, x.dir, x.dp, x.region, x.pname, (x.genres || []).join(' '), (x.awards || []).join(' '), shotTxt].join(' ').toLowerCase();
      }
      if (!x._q.includes(kw)) return false;
    }
    return true;
  });
  renderGrid();
}

function renderGrid() {
  const total = filtered.length;
  const mfTotal = (window.AESTHETIC1000_MANIFEST && window.AESTHETIC1000_MANIFEST.total) || 3000;
  const pages = Math.max(1, Math.ceil(total / state.pageSize));
  if (state.page > pages) state.page = pages;
  const start = (state.page - 1) * state.pageSize;
  const slice = filtered.slice(start, start + state.pageSize);
  document.getElementById('statusTxt').textContent = `当前匹配 ${total} 部唯美电影（已载入 ${ITEMS.length} / ${mfTotal} 部，校验戳 2026-11-26 14:25）`;
  document.getElementById('pageInfo').textContent = `第 ${state.page} / ${pages} 页`;

  const grid = document.getElementById('filmGrid');
  grid.innerHTML = slice.map(x => {
    const fbHtml = `<div class="frame-fallback"><span class="frame-fallback-en">${esc(x.te || x.t)}</span></div>`;
    const covUrl = resolveCover(x.cover);
    const media = covUrl
      ? `<img src="${esc(covUrl)}" alt="${esc(x.t)}" loading="lazy" referrerpolicy="no-referrer" data-rel="${esc(x.cover)}" data-fb="${esc(fbHtml)}" onerror="window.__a1000ImgErr(this)">`
      : fbHtml;
    const pal = (x.pal || []).map(hex => `<span class="swatch" data-hex="${esc(hex)}" title="#${esc(hex)}"></span>`).join('');
    const firstShot = (x.shots && x.shots[0]) ? x.shots[0].prompt : '';
    const bLabel = (x.batch === 'B2') ? '<span class="tag">扩容2000</span>' : '';
    return `<article class="card" data-aid="${esc(x.aid)}">
      <div class="frame-box" data-open="${esc(x.aid)}">
        ${media}
        <span class="badge-no">${esc(x.aid)}</span>
        <span class="badge-shots">${(x.shots || []).length} 镜精研 / ${x.n_all} 帧库</span>
      </div>
      <div class="pal-bar">${pal}</div>
      <div class="card-body">
        <div class="card-tags">
          <span class="tag">${esc(x.pshort)}</span>
          <span class="tag">${x.y}</span>
          ${x.bw ? '<span class="tag">黑白银盐</span>' : ''}
          ${bLabel}
        </div>
        <h2 data-open="${esc(x.aid)}">${esc(x.t || x.te)}</h2>
        <p class="sub-en">${esc(x.te)}</p>
        <div class="meta-row">
          ${x.dir ? `<span>导演：${esc(x.dir)}</span>` : ''}
          ${x.dp ? `<span>摄影：${esc(x.dp)}</span>` : ''}
          ${x.region ? `<span>${esc(x.region)}</span>` : ''}
          ${x.ar ? `<span>${esc(x.ar)}</span>` : ''}
        </div>
        ${firstShot ? `<p class="shot-preview">${esc(firstShot)}</p>` : ''}
        <div class="card-actions">
          <button type="button" class="btn-sm primary" data-open="${esc(x.aid)}">查看镜头描述与色板</button>
          ${firstShot ? `<button type="button" class="btn-sm copy-first" data-aid="${esc(x.aid)}">复制首镜提示词</button>` : ''}
        </div>
      </div>
    </article>`;
  }).join('');
  paintSwatches(grid);

  grid.querySelectorAll('[data-open]').forEach(el => {
    el.onclick = () => openModal(el.dataset.open);
  });
  grid.querySelectorAll('.copy-first').forEach(btn => {
    btn.onclick = () => {
      const rec = ITEMS.find(r => r.aid === btn.dataset.aid);
      if (rec && rec.shots && rec.shots[0]) copyText(rec.shots[0].prompt, btn, '已复制');
    };
  });

  const pb = document.getElementById('pagerBar');
  const btns = [];
  if (state.page > 1) btns.push(`<button type="button" class="btn-sm" data-pg="${state.page - 1}">上一页</button>`);
  const lo = Math.max(1, state.page - 3), hi = Math.min(pages, state.page + 3);
  for (let p = lo; p <= hi; p++) {
    btns.push(`<button type="button" class="btn-sm ${p === state.page ? 'primary' : ''}" data-pg="${p}">${p}</button>`);
  }
  if (state.page < pages) btns.push(`<button type="button" class="btn-sm" data-pg="${state.page + 1}">下一页</button>`);
  pb.innerHTML = btns.join('');
  pb.querySelectorAll('button').forEach(b => {
    b.onclick = () => { state.page = Number(b.dataset.pg); renderGrid(); window.scrollTo({ top: 0, behavior: 'auto' }); };
  });
}

function openModal(aid) {
  const x = ITEMS.find(r => r.aid === aid);
  if (!x) return;
  document.getElementById('modalTitle').textContent = `${x.aid} ${x.t || x.te} (${x.y})`;
  document.getElementById('modalSub').textContent = [x.te, x.dir && ('导演 ' + x.dir), x.dp && ('摄影 ' + x.dp), x.region, x.ar, x.format].filter(Boolean).join(' / ');
  const covUrl = resolveCover(x.cover);
  const covHtml = covUrl ? `<img class="modal-cover" src="${esc(covUrl)}" alt="${esc(x.t)}" referrerpolicy="no-referrer" data-rel="${esc(x.cover)}" onerror="window.__a1000ImgErr(this)">` : '';
  const palHtml = (x.pal || []).length
    ? `<div class="pal-chips">${(x.pal || []).map(h => `<span class="pal-chip"><span class="pal-dot" data-hex="${esc(h)}"></span>#${esc(h)}</span>`).join('')}</div>`
    : '';
  const metaChips = [
    ...(x.genres || []).map(g => `<span class="tag">${esc(g)}</span>`),
    ...(x.awards || []).map(a => `<span class="tag">${esc(a)}</span>`),
    ...(x.classics || []).map(c => `<span class="tag">${esc(c)}</span>`),
  ].join('');
  const shotsHtml = (x.shots || []).map((s, idx) => `
    <div class="shot-item">
      <div class="shot-top">
        <span class="shot-id">镜头 #${idx + 1} ${esc(s.id)}</span>
        <button type="button" class="btn-sm primary modal-copy-shot" data-idx="${idx}">复制该镜中文提示词</button>
      </div>
      <p class="shot-prompt">${esc(s.prompt)}</p>
      ${s.analysis ? `<p class="shot-analysis">${esc(s.analysis)}</p>` : ''}
    </div>
  `).join('') || '<p class="shot-analysis">暂无精研文本记录，请查阅色板与主库条目。</p>';
  const extLink = x.src_url ? `<p class="modal-src"><a href="${esc(x.src_url)}" target="_blank" rel="noopener noreferrer">参考档案原始来源</a></p>` : '';

  const body = document.getElementById('modalBody');
  body.innerHTML = `${covHtml}${palHtml}<div class="card-tags">${metaChips}</div>${shotsHtml}${extLink}`;
  paintSwatches(body);
  body.querySelectorAll('.modal-copy-shot').forEach(btn => {
    btn.onclick = () => {
      const s = x.shots[Number(btn.dataset.idx)];
      if (s) copyText(s.prompt, btn, '已复制提示词');
    };
  });
  document.getElementById('filmModal').classList.add('open');
}

document.getElementById('modalClose').onclick = () => document.getElementById('filmModal').classList.remove('open');
document.getElementById('filmModal').onclick = e => {
  if (e.target.id === 'filmModal') document.getElementById('filmModal').classList.remove('open');
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('filmModal').classList.remove('open');
});

document.getElementById('pillarBar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  document.querySelectorAll('#pillarBar button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  state.pid = b.dataset.pid || '';
  applyFilters(true);
});

document.getElementById('qInput').addEventListener('input', e => { state.q = e.target.value; applyFilters(true); });
document.getElementById('batchFilter').addEventListener('change', e => { state.batch = e.target.value; applyFilters(true); });
document.getElementById('coverFilter').addEventListener('change', e => { state.cover = e.target.value; applyFilters(true); });
document.getElementById('bwFilter').addEventListener('change', e => { state.bw = e.target.value; applyFilters(true); });
document.getElementById('randBtn').onclick = () => {
  if (!filtered.length) return;
  const pick = filtered[Math.floor(Math.random() * filtered.length)];
  openModal(pick.aid);
};
document.getElementById('exportCsvBtn').onclick = () => {
  const header = ['aid','batch','pname','t','te','y','dir','dp','region','ar','bw','pal','prompt1'];
  const escCsv = v => '"' + String(v || '').replace(/"/g, '""') + '"';
  const rows = [header.join(',')].concat(filtered.map(x => [
    x.aid, x.batch || 'B1', x.pname, x.t, x.te, x.y, x.dir, x.dp, x.region, x.ar, x.bw ? 'BW' : 'Color',
    (x.pal || []).join('|'), (x.shots && x.shots[0]) ? x.shots[0].prompt : ''
  ].map(escCsv).join(',')));
  const blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `aesthetic3000_${filtered.length}.csv`;
  a.click();
};

function loadShard(file) {
  return new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'aesthetic1000_data/' + file + '?v=202611261425';
    s.onload = () => resolve(true);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

(async function hydrate() {
  renderPillars();
  const mf = window.AESTHETIC1000_MANIFEST;
  if (!mf || !Array.isArray(mf.shards)) return;
  for (let i = 0; i < mf.shards.length; i += 5) {
    const chunk = mf.shards.slice(i, i + 5);
    await Promise.all(chunk.map(sh => loadShard(sh.file)));
    for (const sh of chunk) {
      const k = sh.key || sh.code;
      const rows = window.__AESTHETIC1000_SHARDS__[k] || [];
      for (const r of rows) ITEMS.push(r);
    }
    applyFilters(false);
  }
})();
</script>
