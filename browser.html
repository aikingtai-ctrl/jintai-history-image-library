async function openCard(r){cur=r;$('title').textContent=r.title;$('metadata').textContent=`${r.id} · ${r.group} · ${r.era||''} · ${r.catName} / ${r.sub||''} · 预估等级 ${r.level||''}`;$('anchor').textContent='锚点句：'+(r.anchor||'');$('src').textContent='依据提示：'+(r.src||'')+'　｜　馆藏与记载：'+(r.hold||'待补');const v=$('view');v.innerHTML='';$('message').textContent='';if(!$('detail').open)$('detail').showModal();if(!r.variants||!r.variants.length){$('prompt').value='正在高速载入完整提示词…';await hydrateShard(r._shardFile);}if(cur!==r)return;if(!r.variants||!r.variants.length){$('prompt').value='分片载入失败：'+r._shardFile;return;}r.variants.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.label;v.appendChild(o);});show(0);}
function show(i){const x=cur.variants[i];$('prompt').value=x.prompt;$('ratio').textContent='画幅 '+x.ratio;$('ref').textContent='参考图：'+(x.ref||'标准设定');}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);$('message').textContent=msg;}catch(e){$('prompt').select();document.execCommand('copy');$('message').textContent=msg+'（已用兼容方式复制）';}}
$('view').onchange=e=>show(e.target.value);
$('copy').onclick=()=>copyText($('prompt').value,'已复制，去 IMAGE 2 粘贴即可。');
$('go').onclick=async()=>{await copyText($('prompt').value,'已复制，IMAGE 2 已在新标签打开，粘贴后选画幅 '+cur.variants[$('view').value].ratio+'。');window.open(JIMENG,'_blank');};
$('copyAll').onclick=()=>copyText(cur.variants.map(x=>`【${cur.id} ${cur.title} · ${x.label} · 画幅 ${x.ratio}】\n${x.prompt}`).join('\\n\\n'),'已复制本条全部视角。');
$('download').onclick=()=>{const t=cur.variants.map(x=>`【${cur.id} ${cur.title} · ${x.label} · 画幅 ${x.ratio} · 参考图 ${x.ref||''}】\n${x.prompt}`).join('\\n\\n')+`\n\n依据提示：${cur.src||''}\n预估等级：${cur.level||''}`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download=cur.id+'_'+cur.title+'.txt';a.click();};
$('exportBtn').onclick=()=>{const t=filtered.map(r=>r.variants.map(x=>`【${r.id} ${r.title} · ${x.label} · 画幅 ${x.ratio}】\n${x.prompt}`).join('\\n\\n')).join('\\n\\n=====\\n\\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='提示词导出_'+filtered.length+'条目.txt';a.click();};
$('resetBtn').onclick=()=>{$('group').value='';$('kind').value='';$('cat').value='';$('sort').value='chrono';$('query').value='';apply();};
$('close').onclick=()=>$('detail').close();$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
function jump(){const v=parseInt($('goto').value,10);if(!isNaN(v)){page=Math.max(0,v-1);render();window.scrollTo({top:$('count').offsetTop-20,behavior:'smooth'});}}
$('go2').onclick=jump;$('goto').addEventListener('keydown',e=>{if(e.key==='Enter')jump();});$('psize').onchange=()=>{PAGE=parseInt($('psize').value,10);page=0;render();};
['group','kind','cat','sort'].forEach(id=>$(id).onchange=apply);$('group').addEventListener('change',()=>{SHARDS.filter(x=>x.era===$('group').value).forEach(loadShard);});$('query').oninput=apply;render();loadAll();
</script></body></html>
