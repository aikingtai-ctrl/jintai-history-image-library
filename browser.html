  if(g.startsWith('十'))return 110;
  return 120;
}
const IDX_CHUNKS=["idx_20261109105150_00.js","idx_20261109105150_01.js","idx_20261109105150_02.js","idx_20261109105150_03.js","idx_20261109105150_04.js","idx_20261109105150_05.js","idx_20261109105150_06.js","idx_20261109105150_07.js","idx_20261109105150_08.js","idx_20261109105150_09.js","idx_20261109105150_10.js","idx_20261109105150_11.js"];
const CDN_BASES=['https://gcore.jsdelivr.net/gh/aikingtai-ctrl/jintai-history-image-library@main/','https://fastly.jsdelivr.net/gh/aikingtai-ctrl/jintai-history-image-library@main/'];
const IS_GH_HOST=/github\.io$/i.test(location.hostname||'');
const byId=new Map(),idxCovered=new Set(),hydratedShards=new Set(),hydratingMap=new Map();
function buildUrls(cdnRel,primaryRel,altRel){const u=[];if(IS_GH_HOST){const onP=/^(d1_idx|d2_idx)\//.test(cdnRel);if(onP)u.push(primaryRel);CDN_BASES.forEach(b=>u.push(b+cdnRel));if(!onP)u.push(primaryRel);}else{u.push(primaryRel);if(altRel&&altRel!==primaryRel)u.push(altRel);if(cdnRel&&cdnRel!==primaryRel&&cdnRel!==altRel)u.push(cdnRel);if(location.protocol!=='file:')CDN_BASES.forEach(b=>u.push(b+cdnRel));}return u;}
function loadScriptChain(urls,timeoutMs){return new Promise(res=>{let i=0;function next(){if(i>=urls.length){res(false);return;}const s=document.createElement('script');let done=false;const tm=setTimeout(()=>{if(!done){done=true;s.onload=s.onerror=null;if(s.parentNode)s.parentNode.removeChild(s);next();}},timeoutMs||6500);s.src=urls[i++];s.onload=()=>{if(!done){done=true;clearTimeout(tm);res(true);}};s.onerror=()=>{if(!done){done=true;clearTimeout(tm);if(s.parentNode)s.parentNode.removeChild(s);next();}};document.head.appendChild(s);}next();});}
window.__IDX_BATCH__=(groups)=>{groups.forEach(gr=>{const shardFile=gr[0],g=gr[1],rows=gr[2];if(idxCovered.has(shardFile))return;idxCovered.add(shardFile);loaded.add(shardFile);const idxBase=records.length;rows.forEach((a,i)=>{if(byId.has(a[0]))return;const r={id:a[0],title:a[1],group:a[2]||g||'',era:a[3],dyn:a[4],kind:a[5],cat:a[6],catName:a[7]||a[6]||'',sub:a[8],anchor:a[9],src:a[10],hold:a[11],level:a[12],n:a[13]||1,variants:[],_shardFile:shardFile};r._isHF=(r.kind==='历史名人'||(r.id||'').startsWith('HF-')||(r.id||'').startsWith('JT-HF-'));r._gRank=groupOrder(r.group);r._idx=idxBase+i;r._search=((r.id||'')+' '+(r.title||'')+' '+(r.era||'')+' '+(r.sub||'')+' '+(r.anchor||'')+' '+(r.dyn||'')+' '+(r.hold||'')).toLowerCase();byId.set(r.id,r);records.push(r);});});};
let _curLoadingFile='';
window.__SHARD__=(file,g,recs)=>{const diskFile=_curLoadingFile||file;const idxBase=records.length;recs.forEach((r,i)=>{if(!r.group)r.group=g||r.era||'';if(!r.catName)r.catName=r.cat||'';if(!r.anchor)r.anchor=r.brief||'';(r.variants||[]).forEach(v=>{if(v.p!==undefined){v.prompt=v.p.includes('\x01')?v.p.replace('\x01',r.c||''):v.p;delete v.p;}});const ex=byId.get(r.id);if(ex){ex.variants=r.variants||[];ex.c=r.c||'';}else{r._isHF=(r.kind==='历史名人'||(r.id||'').startsWith('HF-')||(r.id||'').startsWith('JT-HF-'));r._gRank=groupOrder(r.group);r._idx=idxBase+i;r._shardFile=diskFile;r.n=r.n||(r.variants?r.variants.length:1);r._search=((r.id||'')+' '+(r.title||'')+' '+(r.era||'')+' '+(r.sub||'')+' '+(r.anchor||'')+' '+(r.dyn||'')+' '+(r.hold||'')).toLowerCase();byId.set(r.id,r);records.push(r);}});loaded.add(diskFile);hydratedShards.add(diskFile);};
function hydrateShard(shardFile){if(!shardFile||hydratedShards.has(shardFile))return Promise.resolve(true);if(hydratingMap.has(shardFile))return hydratingMap.get(shardFile);const p=(async()=>{_curLoadingFile=shardFile;const ok=await loadScriptChain(buildUrls('d2/'+shardFile,DATA_DIR+'/'+shardFile,ALT_DIR+'/'+shardFile),12000);_curLoadingFile='';if(ok)hydratedShards.add(shardFile);return ok;})();hydratingMap.set(shardFile,p);return p;}
function loadShard(s){if(loaded.has(s.file))return Promise.resolve();if(pending.has(s.file))return pending.get(s.file);const p=hydrateShard(s.file);pending.set(s.file,p);return p;}
async function loadAll(){await Promise.all(IDX_CHUNKS.map(async fn=>{await loadScriptChain(buildUrls('d2_idx/'+fn,'d2_idx/'+fn,'d2_idx/'+fn),10000);apply();}));const extra=SHARDS.filter(s=>!loaded.has(s.file));if(extra.length>0){await Promise.all(extra.map(s=>loadShard(s)));apply();}}
let PAGE=30, _lastCatCount=-1;
let state={group:'',kind:'',cat:'',q:'',sort:'chrono',page:1},filtered=[],curItem=null,curView=0;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function rebuildCats(){
  const pool=records.filter(x=>{
    if(state.group && x.group!==state.group) return false;
    if(state.kind){
      if(state.kind==='历史名人' && !x._isHF) return false;
      if(state.kind!=='历史名人' && x.kind!==state.kind) return false;
    }
    return true;
  });
  const m=new Map();
  pool.forEach(x=>{ const c=x.catName||x.cat||''; if(c) m.set(c,(m.get(c)||0)+1); });
  const sel=$('cat'),prev=state.cat;
  sel.innerHTML='<option value="">全部细目 ('+m.size+')</option>'+[...m.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<option value="${esc(k)}">${esc(k)} (${v})</option>`).join('');
  sel.value=m.has(prev)?prev:'';state.cat=sel.value;
}
function apply(){
  if(records.length!==_lastCatCount){ _lastCatCount=records.length; rebuildCats(); }
  const terms=state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  filtered=records.filter(x=>{
    if(state.group&&x.group!==state.group)return false;
    if(state.kind){
      if(state.kind==='历史名人'&&!x._isHF)return false;
      if(state.kind!=='历史名人'&&x.kind!==state.kind)return false;
    }
    if(state.cat&&(x.catName||x.cat)!==state.cat)return false;
    if(terms.length){
      const hay=x._search||((x.id||'')+' '+(x.title||'')+' '+(x.group||'')+' '+(x.anchor||'')).toLowerCase();
      for(const t of terms){ if(!hay.includes(t)) return false; }
    }
    return true;
  });
  const s=state.sort||'chrono';
  filtered.sort((a,b)=>{
    if(s==='chrono') return (a._gRank-b._gRank) || (a._idx-b._idx);
    if(s==='chronoDesc') return (b._gRank-a._gRank) || (b._idx-a._idx);
    if(s==='title') return String(a.title||'').localeCompare(String(b.title||''),'zh-CN');
    return String(a.id||'').localeCompare(String(b.id||''));
  });
  state.page=1;render();
}
function render(){
  const total=filtered.length,pages=Math.max(1,Math.ceil(total/PAGE));
  if(state.page>pages)state.page=pages;
  $('count').textContent=`共 ${total.toLocaleString()} 条`;
  $('pinfoTop').textContent=`第 ${state.page} / ${pages.toLocaleString()} 页`;
  const slice=filtered.slice((state.page-1)*PAGE,state.page*PAGE);
  $('grid').innerHTML=slice.map((x,idx)=>`<article class="card" onclick="openModal(${(state.page-1)*PAGE+idx})">
    <h3>${esc(x.title)}</h3>
    <div class="desc">${esc(x.anchor||'')}</div>
    <div class="card-foot"><span>${esc(x.era||x.group||'')} ｜ ${esc(x._isHF?'历史名人':(x.kind||''))}${(x.catName||x.cat)?' · '+esc(x.catName||x.cat):''}</span><span class="views">${x.n||(x.variants||[]).length||1} 视角</span></div>
  </article>`).join('')||'<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:48px;background:#fff;border:1px dashed var(--line);border-radius:12px">未找到匹配条目，请缩短关键词或点击「清除」。</p>';
  $('pager').innerHTML=`<button ${state.page<=1?'disabled':''} onclick="go(${state.page-1})">上一页</button>
    <span>第 ${state.page} / ${pages.toLocaleString()} 页</span>
    <button ${state.page>=pages?'disabled':''} onclick="go(${state.page+1})">下一页</button>`;
}
function go(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'});}

async function openModal(i){
  const item=filtered[i]; if(!item) return;
  if(!item.variants || !item.variants.length){
    const ok=await hydrateShard(item._shardFile);
    if(!ok){ alert('分片加载失败：'+item._shardFile); return; }
  }
  curItem=item;curView=0;
  $('mMeta').textContent=`#${curItem.id} · ${curItem.group||''} · ${curItem.kind||''} / ${curItem.catName||curItem.cat||''}`;
  $('mTitle').textContent=curItem.title;
  $('mDesc').textContent=curItem.anchor||'';
  renderModalView();
  $('modal').classList.add('open');
}
function renderModalView(){
  const vs=curItem.variants||[];
  $('mTabs').innerHTML=vs.map((v,i)=>`<button class="${i===curView?'active':''}" onclick="curView=${i};renderModalView()">${esc((v.label||v.name||('视角'+(i+1)))+(v.ratio?' ('+v.ratio+')':''))}</button>`).join('');
  $('mPrompt').textContent=vs[curView]?(vs[curView].prompt||''):'（无提示词）';
}
function closeModal(){$('modal').classList.remove('open');}
async function clip(t){try{await navigator.clipboard.writeText(t);}catch{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}}
async function copyCur(){if(!curItem||!(curItem.variants||[])[curView])return;await clip(curItem.variants[curView].prompt||'');if($('btnCopyCur')){$('btnCopyCur').textContent='已复制 ✓';setTimeout(()=>$('btnCopyCur').textContent='复制当前提示词',1200);}}
async function copyAll(){if(!curItem)return;await clip((curItem.variants||[]).map(v=>`【${v.label||v.name||''}】\n${v.prompt||''}`).join('\n\n'));if($('btnCopyAll')){$('btnCopyAll').textContent='已复制全部 ✓';setTimeout(()=>$('btnCopyAll').textContent='复制全部视角',1200);}}
async function copyAndOpenGpt(){window.open(JIMENG,'_blank','noopener');if(curItem&&(curItem.variants||[])[curView])await clip(curItem.variants[curView].prompt||'');if($('btnGoGpt')){$('btnGoGpt').textContent='已复制 · 已打开 GPT Image 2 ✓';setTimeout(()=>$('btnGoGpt').textContent='复制并打开 GPT Image 2',1400);}}

let qTmr=null;
$('group').onchange=e=>{state.group=e.target.value;rebuildCats();apply();};
$('kind').onchange=e=>{state.kind=e.target.value;rebuildCats();apply();};
$('cat').onchange=e=>{state.cat=e.target.value;apply();};
$('sort').onchange=e=>{state.sort=e.target.value;apply();};
$('query').oninput=e=>{clearTimeout(qTmr);qTmr=setTimeout(()=>{state.q=e.target.value;apply();},120);};
$('resetBtn').onclick=()=>{
  state={group:'',kind:'',cat:'',q:'',sort:'chrono',page:1};
  $('group').value='';$('kind').value='';$('sort').value='chrono';$('query').value='';
  rebuildCats();apply();$('query').focus();
};
$('exportBtn').onclick=async()=>{
  if(!filtered.length) return alert('当前无筛选结果');
  if(filtered.length>2000&&!confirm(`将导出 ${filtered.length} 条记录，继续？`))return;
  const need=Array.from(new Set(filtered.filter(x=>!x.variants||!x.variants.length).map(x=>x._shardFile).filter(Boolean)));
  for(let i=0;i<need.length;i++){ $('count').textContent=`加载分片 ${i+1}/${need.length}…`; await hydrateShard(need[i]); }
  const txt=filtered.map(x=>`=== ${x.id} ${x.title} [${x.group}/${x.kind}/${x.catName||x.cat}] ===\n${x.anchor||''}\n`+(x.variants||[]).map(v=>`【${v.label||v.name||''}】\n${v.prompt||''}`).join('\n')).join('\n\n');
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`prompts_${filtered.length}.txt`;a.click();
  render();
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
loadAll();
