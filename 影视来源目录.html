<style>
:root{color-scheme:dark;--bg:#121416;--p1:#1a1d20;--p2:#22262a;--p3:#2b3036;--line:#343a40;--tx:#ece8e0;--mu:#9e9a91;--ac:#e0a943;--ac2:#71b8cf}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:20px/1.58 "Microsoft YaHei","PingFang SC",sans-serif}
a{color:var(--ac2);text-decoration:none}a:hover{text-decoration:underline}
b,.gold{color:var(--ac)}
.muted{color:var(--mu);font-size:17.5px}
input,select,button{font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--p2);color:inherit;padding:8px 14px;font-size:18px}
button{cursor:pointer;transition:border-color .14s,background .14s}
button:disabled{opacity:.4;cursor:not-allowed}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#1a1409;border-color:var(--ac);font-weight:700}
button.ghost{background:transparent;color:var(--mu)}button.ghost:hover{color:var(--tx)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a.button{display:inline-block;border:1px solid var(--line);border-radius:9px;padding:6px 12px;text-decoration:none;margin:3px 6px 3px 0;font-size:17px;background:var(--p2)}

/* === Minimalist Sticky Search-First Top Header === */
header.top{position:sticky;top:0;z-index:30;background:rgba(15,17,19,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar{max-width:1840px;margin:auto;padding:10px 26px 8px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .back-link{color:var(--mu);font-size:17px;font-weight:600}
.brand .back-link:hover{color:var(--ac);text-decoration:none}
.brand .sep{color:#555c63}
.brand strong{font-size:23px;color:var(--tx);letter-spacing:.5px}
.brand .kpi{font-size:16.5px;color:var(--mu)}
.brand .kpi b{color:var(--ac);font-weight:700}
.topnav{display:flex;gap:16px;font-size:17px}
.topnav a{color:var(--mu)}
.topnav a:hover{color:var(--tx);text-decoration:none}

.top-search-wrap{max-width:1840px;margin:auto;padding:2px 26px 12px}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:300px;font-size:21px;padding:10px 16px;border-radius:11px;border:1.5px solid #454c54;background:#16191c}
#q:focus{border-color:var(--ac);background:#1a1e22}
#q::placeholder{color:#7c8288;font-size:19px}
.qbtn{font-size:17px;padding:8px 14px;border-radius:10px;background:var(--p1);color:var(--mu)}
.qbtn.on{background:var(--tx);color:#121416;border-color:var(--tx);font-weight:700}
.filter-toggle.has-on{border-color:var(--ac);color:var(--ac);background:#2a2417}

main{max-width:1840px;margin:auto;padding:12px 26px 72px}

/* === Collapsible Filter Drawer (Closed by Default!) === */
details.filter-drawer{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:14px}
details.filter-drawer:not([open]){display:none}
.controls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px;align-items:end}
.controls-grid label{display:flex;flex-direction:column;gap:4px;font-size:15.5px;color:var(--mu)}
.controls-grid select{width:100%;font-size:17px;padding:7px 10px;background:var(--p2)}
.browse{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.browse summary{cursor:pointer;font-size:17px;color:var(--mu);user-select:none}
.browse p{margin:10px 0;font-size:16.5px}
.browse button{font-size:16px;padding:4px 11px;margin:3px 5px 3px 0;border-radius:16px;background:var(--p2)}

/* === Result Bar & Active Pills === */
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 12px;font-size:18px;color:var(--mu)}
#count b{color:var(--ac);font-size:20px}
.active-inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--p3);border:1px solid var(--line);border-radius:20px;padding:2px 11px;font-size:16.5px;color:var(--tx)}
.pill.q{border-color:var(--ac)}
.pill i{font-style:normal;color:var(--mu);font-size:14.5px}
.pill button{border:0;background:none;padding:0 2px;font-size:18px;color:var(--mu)}
#error:empty{display:none}#error{color:#ffb7aa;margin:8px 0}

/* === Uniform, Crisp Film Cards === */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:16px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:13px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere;transition:border-color .14s,transform .14s}
.card:hover{border-color:var(--ac);transform:translateY(-1px)}
.card h3{font-size:22px;margin:0;line-height:1.35;color:var(--tx)}
.card h3.clickable{cursor:pointer}.card h3.clickable:hover{color:var(--ac)}
.card h3 .yr{font-size:17px;font-weight:400;color:var(--mu);margin-left:4px}
.en-sub{font-size:15.5px;color:#88847c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.meta-line{margin:0;font-size:17.5px;color:#c9c4ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta-sub{font-size:16px;color:var(--mu)}
details.ev-fold{margin:0}
details.ev-fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;user-select:none}
details.ev-fold summary::-webkit-details-marker{display:none}
.honor-pill{font-size:16px;color:var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-more{font-size:14.5px;color:var(--mu);flex-shrink:0}
.evidence{border-top:1px solid #2b3036;margin-top:8px;padding-top:8px;max-height:200px;overflow:auto}
.evidence a,.evidence p{display:block;margin:4px 0;font-size:16px}
.card-acts{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:8px}
.card-acts .pri{flex:1;padding:8px 14px;font-size:17.5px}
.card-acts .ghost{padding:8px 12px;font-size:16.5px}

.pager{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:28px 0 18px}
.page-nums{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}.pnum{min-width:44px;padding:6px 12px;text-align:center}.pnum.on{background:var(--ac);color:#121416;border-color:var(--ac);font-weight:700}.pdots{color:var(--mu);padding:0 4px}.page-jump{display:inline-flex;gap:6px;align-items:center;color:var(--mu);font-size:17px}.page-jump select{min-width:150px;font-size:17px;padding:6px 10px}.page-jump input[type="number"]{flex:0 0 auto;width:90px;min-width:0;text-align:center;font-size:17px;padding:6px 8px}
.empty{padding:48px;text-align:center;color:var(--mu);font-size:20px;grid-column:1/-1}

/* === Collapsed Footer Library Metadata === */
details.meta-fold{margin-top:28px;border-top:1px solid #262a2f;padding-top:12px;color:var(--mu);font-size:16px}
details.meta-fold summary{cursor:pointer;user-select:none;color:#7f848a;font-size:15.5px}
details.meta-fold .stats{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}
details.meta-fold .stats b{font-size:20px}
details.meta-fold p{margin:6px 0;font-size:16px}
.notice{background:var(--p2);padding:11px 16px;border-left:3px solid var(--ac);border-radius:6px;font-size:17px}

/* === Dialogs === */
.frame{display:grid;grid-template-columns:1fr auto;gap:12px}.frame small{font-size:16px}
dialog{background:var(--bg);color:inherit;width:min(1620px,96vw);max-height:94vh;border:1px solid var(--line);border-radius:16px;font:inherit;padding:22px}
dialog::backdrop{background:#000c}
.dialog-head{position:sticky;top:-22px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:12px;z-index:2}
.dialog-head h2{margin:0;font-size:25px}
.prompt-list{display:grid;gap:18px}
.prompt-list .card{transform:none}
.prompt-text{display:block;width:100%;min-height:185px;resize:vertical;background:#101214;color:inherit;border:1px solid #454c54;border-radius:10px;padding:13px;font:19px/1.68 "Microsoft YaHei",sans-serif}
.prompt-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.prompt-label{color:var(--ac);font-weight:700;font-size:18px}
.prompt-status{min-height:1.5em;color:var(--ac)}
@media(max-width:760px){.topbar,.top-search-wrap,main{padding-left:14px;padding-right:14px}.grid,.frame{grid-template-columns:1fr}#q{min-width:200px}}
