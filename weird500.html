<script>

const D = window.WEIRD500_DATA || {items:[], pillars:[]};
const ITEMS = D.items || [];
const PILLARS = D.pillars || [];
const IS_GH = /github\.io$/i.test(location.hostname || '');
const RAW_BASE = 'https://raw.githubusercontent.com/aikingtai-ctrl/jintai-history-image-library/main/';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let curPillar = '';

function resolveCover(rel) {
  if (!rel) return '';
  if (/^https?:/i.test(rel)) return rel;
  if (IS_GH || location.protocol === 'file:') return RAW_BASE + rel;
  return rel;
}
window.__w500ImgErr = function(img) {
  const rel = img.getAttribute('data-rel') || '';
  if (rel && !img.getAttribute('data-raw-tried') && !/^https?:/i.test(rel) && !IS_GH && location.protocol !== 'file:') {
    img.setAttribute('data-raw-tried', '1');
    img.src = RAW_BASE + rel;
    return;
  }
  const fb = img.getAttribute('data-fb');
  if (fb) img.outerHTML = fb;
};

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.style.display = 'none', 1800);
}

function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => toast('已复制提示词')).catch(() => fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('已复制提示词'); } catch(e) { toast('请手动复制'); }
  document.body.removeChild(ta);
}

function initFilters() {
  $('hdrStat').textContent = `${ITEMS.length} 部真片 · ${PILLARS.length} 大谱系 · 已有高清封面 ${D.with_cover || 0} 部`;
  const tabs = [`<button class="ptab on" data-pid="">全部 (${ITEMS.length})</button>`]
    .concat(PILLARS.map(p => {
      const c = ITEMS.filter(x => x.pillar_id === p.id).length;
      return `<button class="ptab" data-pid="${esc(p.id)}">${esc(p.short)} (${c})</button>`;
    }));
  $('pillarTabs').innerHTML = tabs.join('');
  $('pillarTabs').onclick = e => {
    const btn = e.target.closest('.ptab');
    if (!btn) return;
    curPillar = btn.dataset.pid || '';
    document.querySelectorAll('.ptab').forEach(b => b.classList.toggle('on', b === btn));
    apply();
  };

  const decs = Array.from(new Set(ITEMS.map(x => x.decade).filter(Boolean))).sort();
  $('fDecade').innerHTML = '<option value="">全部年代</option>' + decs.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
  const regs = Array.from(new Set(ITEMS.map(x => x.region).filter(Boolean))).sort((a,b) => a.localeCompare(b, 'zh-CN'));
  $('fRegion').innerHTML = '<option value="">全部国家/地区</option>' + regs.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');

  ['q','fDecade','fRegion','fColor','fCover'].forEach(id => $(id).addEventListener(id === 'q' ? 'input' : 'change', apply));
  $('fView').onchange = () => $('grid').classList.toggle('v2col', $('fView').value === '2');
  $('btnReset').onclick = () => {
    $('q').value = ''; $('fDecade').value = ''; $('fRegion').value = ''; $('fColor').value = ''; $('fCover').value = '';
    curPillar = '';
    document.querySelectorAll('.ptab').forEach((b,i) => b.classList.toggle('on', i === 0));
    apply();
  };
  $('btnExportJson').onclick = () => downloadExport('json');
  $('btnExportCsv').onclick = () => downloadExport('csv');
}

let currentList = ITEMS;
function apply() {
  const tokens = ($('q').value || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const dec = $('fDecade').value, reg = $('fRegion').value, col = $('fColor').value, cov = $('fCover').value;
  currentList = ITEMS.filter(x => {
    if (curPillar && x.pillar_id !== curPillar) return false;
    if (dec && x.decade !== dec) return false;
    if (reg && x.region !== reg) return false;
    if (col === 'bw' && !x.bw) return false;
    if (col === 'color' && x.bw) return false;
    if (cov === '1' && !x.cover) return false;
    if (tokens.length) {
      const hay = [x.t, x.te, x.y, x.dir, x.dp, x.region, x.pillar, x.look, (x.genres||[]).join(' '), x.awards, (x.shots||[]).map(s=>s.scene+' '+s.prompt).join(' ')].join(' ').toLowerCase();
      if (!tokens.every(tk => hay.includes(tk))) return false;
    }
    return true;
  });

  const pObj = PILLARS.find(p => p.id === curPillar);
  $('pillarDesc').textContent = pObj ? pObj.desc : '';
  $('statusText').textContent = `当前显示 ${currentList.length} / ${ITEMS.length} 部`;

  $('grid').innerHTML = currentList.map(x => {
    const palHtml = (x.pal5 || []).map(c => `<span style="background:${esc(c)}"></span>`).join('');
    const dotsHtml = (x.pal5 || []).map(c => `<i style="background:${esc(c)}" title="${esc(c)}"></i>`).join('');
    const covUrl = resolveCover(x.cover);
    const posterFallback = `<div class="dna-poster"><div class="dna-strips">${palHtml}</div><div class="dna-label">${esc(x.te || x.t)} (${x.y})</div></div>`;
    const mediaHtml = covUrl
      ? `<img loading="lazy" src="${esc(covUrl)}" alt="${esc(x.t)}" data-rel="${esc(x.cover)}" data-fb="${esc(posterFallback)}" onerror="window.__w500ImgErr(this)">`
      : posterFallback;
    return `<article class="card" data-wid="${esc(x.wid)}">
      <div class="cover-box">
        <span class="badge-rank">#${String(x.rank).padStart(3,'0')}</span>
        <span class="badge-pil">${esc(x.pillar_short)}</span>
        ${mediaHtml}
      </div>
      <div class="card-body">
        <div class="c-title">${esc(x.t)} <span style="font-weight:400;color:var(--muted)">(${x.y})</span></div>
        <div class="c-sub">${esc(x.te && x.te !== x.t ? x.te + ' · ' : '')}${esc(x.dir || '导演待核')}${x.region ? ' · ' + esc(x.region) : ''}</div>
        <div class="c-look">${esc(x.look || (x.shots[0] && x.shots[0].scene) || '')}</div>
        <div class="c-foot">
          <div class="pal-dots">${dotsHtml}</div>
          <span>${x.bw ? '黑白 · ' : ''}${x.n} 镜</span>
        </div>
      </div>
    </article>`;
  }).join('');
}

$('grid').onclick = e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const x = ITEMS.find(it => it.wid === card.dataset.wid);
  if (!x) return;
  openModal(x);
};

function openModal(x) {
  $('dlgTitle').textContent = `#${String(x.rank).padStart(3,'0')} ${x.t} (${x.y})`;
  $('dlgSub').textContent = `${x.te || ''} ｜ ${x.pillar} ｜ ID: ${x.wid}`;
  const palChips = (x.pal5 || []).map(c => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:10px"><i style="display:inline-block;width:18px;height:18px;border-radius:4px;background:${esc(c)};border:1px solid #ccc"></i><code>${esc(c)}</code></span>`).join('');
  const shotsHtml = (x.shots || []).map((s, idx) => `
    <div class="shot-card">
      <div class="shot-head">
        <strong>代表镜头 #${idx + 1} · ${esc(s.id)}</strong>
        <button class="copy-btn" type="button" data-copy-idx="${idx}">复制提示词</button>
      </div>
      ${s.scene ? `<div style="margin-bottom:6px"><b>画面：</b>${esc(s.scene)}</div>` : ''}
      ${s.analysis ? `<div style="margin-bottom:6px;color:#41504a"><b>视听分析：</b>${esc(s.analysis)}</div>` : ''}
      <textarea class="prompt-box" readonly>${esc(s.prompt)}</textarea>
    </div>`).join('');
  $('dlgBody').innerHTML = `
    <div class="meta-grid">
      <div><b>导演：</b>${esc(x.dir || '待核')}</div>
      <div><b>摄影指导（DP）：</b>${esc(x.dp || '待核')}</div>
      <div><b>国家/地区：</b>${esc(x.region || '待核')}</div>
      <div><b>画幅 / 介质：</b>${esc([x.ar, x.format].filter(Boolean).join(' · ') || '待核')}</div>
      <div><b>摄影机 / 镜头：</b>${esc([x.cam, x.lens].filter(Boolean).join(' / ') || '待核')}</div>
      <div><b>全库镜头总数：</b>${x.n} 镜</div>
    </div>
    <div style="margin-bottom:10px"><b>视觉基调：</b>${esc(x.look || '待核')}</div>
    ${x.awards ? `<div style="margin-bottom:10px"><b>奖项荣誉：</b>${esc(x.awards)}</div>` : ''}
    <div style="margin-bottom:12px"><b>五色视觉 DNA：</b>${palChips}</div>
    <div style="margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap">
      <a href="film.html" target="_blank" style="padding:7px 14px;background:var(--accent-soft);border-radius:8px;font-weight:600">在《影视参考图集》检索 →</a>
      <a href="sources.html" target="_blank" style="padding:7px 14px;background:var(--cult-soft);color:var(--cult);border-radius:8px;font-weight:600">在《来源目录》查看全部 ${x.n} 镜 →</a>
    </div>
    ${shotsHtml}`;
  $('dlgBody').onclick = ev => {
    const btn = ev.target.closest('.copy-btn');
    if (!btn) return;
    const s = (x.shots || [])[Number(btn.dataset.copyIdx)];
    if (s) copyText(s.prompt);
  };
  $('dlg').showModal();
}
$('dlgClose').onclick = () => $('dlg').close();
$('dlg').onclick = e => { if (e.target === $('dlg')) $('dlg').close(); };

function downloadExport(fmt) {
  let blob, fname;
  if (fmt === 'json') {
    blob = new Blob([JSON.stringify(currentList, null, 2)], {type:'application/json;charset=utf-8'});
    fname = `weird500_export_${currentList.length}.json`;
  } else {
    const cols = ['rank','wid','pillar_id','pillar','t','te','y','region','dir','dp','ar','format','look','n'];
    const escCsv = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
    const lines = [cols.join(',')].concat(currentList.map(r => cols.map(c => escCsv(r[c])).join(',')));
    blob = new Blob(['\uFEFF' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
    fname = `weird500_export_${currentList.length}.csv`;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
}

initFilters();
apply();
})();
</script>
</body>
</html>
