<title>作品与镜头来源目录 · 影视参考图集</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#121416;color:#ece8e0;font:27px/1.65 "Microsoft YaHei",sans-serif}header,main{max-width:1800px;margin:auto;padding:24px}header{border-bottom:1px solid #3a4046}h1{font-size:42px;margin:12px 0}h2{font-size:34px}h3{font-size:28px;margin:0 0 8px}a{color:#71b8cf}b,.gold{color:#e0a943}.muted{color:#aaa59b;font-size:23px}.stats{display:flex;gap:30px;flex-wrap:wrap}.stats b{font-size:36px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,select,button{font:inherit;border:1px solid #3a4046;border-radius:10px;background:#23272b;color:inherit;padding:10px 16px}input{flex:1;min-width:260px}button{cursor:pointer}button:disabled{opacity:.4}button:hover,a:hover{color:#e0a943}a.button{display:inline-block;border:1px solid #3a4046;border-radius:9px;padding:7px 12px;text-decoration:none;margin:4px 8px 4px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:18px}.card{background:#1a1d20;border:1px solid #3a4046;border-radius:12px;padding:22px;overflow-wrap:anywhere}.card p{margin:8px 0}.pager{display:flex;gap:20px;justify-content:center;align-items:center;margin:24px 0}.notice{background:#23272b;padding:14px 20px;border-left:4px solid #e0a943}.frame{display:grid;grid-template-columns:1fr auto;gap:12px}.frame small{font-size:20px}dialog{background:#121416;color:inherit;width:min(1650px,96vw);max-height:94vh;border:1px solid #3a4046;border-radius:14px;font:inherit;padding:24px}dialog::backdrop{background:#000c}.dialog-head{position:sticky;top:-24px;background:#121416;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0}#error{color:#ffb7aa}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e0a943}@media(max-width:600px){body{font-size:24px}.grid{grid-template-columns:1fr}.frame{grid-template-columns:1fr}}
</style></head><body>
<header><a href="film.html">← 返回影视参考图集</a><h1>作品与镜头来源目录</h1>
<div class="stats" id="stats">正在载入来源目录…</div>
<p class="muted" id="date"></p>
<p class="notice muted">画面参考保留逐张来源外链，标签、时间码、研究笔记与复刻提示词待补。画面条数按来源图片 URL 去重，同一连续镜头可能有多帧。作品目录中的“镜头待补”不计入画面参考数。</p>
</header><main>
<div class="controls"><input id="q" placeholder="搜索中文／原文片名、导演、年份或类型" aria-label="搜索作品"><select id="coverage" aria-label="来源范围"><option value="">全部作品</option><option value="frames">有来源画面</option><option value="sourced">有外部作品资料</option><option value="description">有既有镜头描述</option><option value="pending">仅待核片单</option></select><select id="type" aria-label="作品类型"><option value="">全部类型</option><option>电影</option><option>剧集</option><option>MV</option><option>广告</option></select></div>
<p id="count" class="muted"></p><p id="error" role="alert"></p><div class="grid" id="grid"></div>
<div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div>
<p class="muted">来源：<a href="https://film-grab.com/about/" target="_blank" rel="noopener noreferrer">FilmGrab</a> · <a href="https://github.com/prust/wikipedia-movie-data" target="_blank" rel="noopener noreferrer">Wikipedia 电影元数据集</a> · 既有片单（单独标记待核）。目录元数据保留来源，尚未逐部人工审定。</p>
</main>
<dialog id="detail"><div class="dialog-head"><h2 id="dtitle"></h2><button id="close">关闭</button></div><p class="muted" id="dinfo"></p><p id="dsource"></p><p class="notice muted">以下为源站中的具体画面记录。点击“查看来源画面”到源站查看，本站不下载或展示这些影片截图。画面内容及摄影标签尚待补充。</p><div class="grid" id="frames"></div><div class="pager"><button id="fprev">上一页</button><span id="fpage"></span><button id="fnext">下一页</button></div></dialog>
<script src="d4/summary.js"></script><script src="d4/catalogue.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>{try{const p=new URL(u);return ['http:','https:'].includes(p.protocol)?p.href:'';}catch{return '';}};
const link=(u,label)=>safe(u)?`<a class="button" href="${esc(safe(u))}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:'';
const WORKS=window.FILM_SOURCE_WORKS||[],S=window.FILM_SOURCE_SUMMARY;
let list=[],page=0,frames=[],fpage=0,requestId=0;const PS=36,FPS=30,cache=new Map();
const text=new Map(WORKS.map(w=>[w.id,[w.title,w.title_en,w.year,w.director,w.region,w.type,...w.genres].join(' ').toLowerCase()]));
function render(){const max=Math.max(1,Math.ceil(list.length/PS));page=Math.min(page,max-1);$('count').textContent=`找到 ${list.length.toLocaleString()} 部作品 · 当前结果有 ${list.reduce((n,w)=>n+w.ref_count,0).toLocaleString()} 条来源画面`;
 $('page').textContent=`第 ${page+1} / ${max} 页`;$('prev').disabled=page===0;$('next').disabled=page===max-1;
 $('grid').innerHTML=list.slice(page*PS,(page+1)*PS).map(w=>`<article class="card"><h3>${esc(w.title)}</h3><p class="muted">${esc(w.title_en&&w.title_en!==w.title?w.title_en+' · ':'')}${w.year} · ${esc(w.type)}${w.region?' · '+esc(w.region):''}</p><p class="muted">导演：${esc(w.director||'待补')}<br>${esc(w.status)}</p><p><b>${w.ref_count}</b> 条来源画面 · ${w.description_count} 条既有描述</p><div>${w.ref_count?`<button data-open="${esc(w.id)}">浏览来源画面</button>`:'<span class="muted">镜头待补</span>'}</div><div>${w.sources.map(s=>link(s.url,s.site+' 作品资料')).join('')}</div></article>`).join('')||'<p>没有符合条件的作品。</p>';
 $('grid').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openFrames(b.dataset.open));}
function filter(){const words=$('q').value.toLowerCase().trim().split(/\s+/).filter(Boolean),coverage=$('coverage').value,type=$('type').value;
 list=WORKS.filter(w=>(!type||w.type===type)&&words.every(q=>text.get(w.id).includes(q))&&(!coverage||coverage==='frames'&&w.ref_count>0||coverage==='sourced'&&w.sources.length>0||coverage==='description'&&w.description_count>0||coverage==='pending'&&!w.sources.length));page=0;render();}
function renderFrames(){const max=Math.max(1,Math.ceil(frames.length/FPS));$('fpage').textContent=`第 ${fpage+1} / ${max} 页`;$('fprev').disabled=fpage===0;$('fnext').disabled=fpage===max-1;
 $('frames').innerHTML=frames.slice(fpage*FPS,(fpage+1)*FPS).map((f,i)=>`<article class="card frame"><div><b>来源画面 ${fpage*FPS+i+1}</b><p>${esc(f[1])}</p><small class="muted">${esc(f[0])}<br>标签待补 · 时间码待核</small></div><div>${link(f[2],'查看来源画面')}${link(f[3],'作品画廊')}</div></article>`).join('');}
async function openFrames(id){const w=WORKS.find(w=>w.id===id);if(!w)return;const token=++requestId;$('dtitle').textContent=w.title+'（'+w.year+'）';$('dinfo').textContent=`${w.ref_count} 条去重来源画面 · 原站图名不是场景分析`;$('dsource').innerHTML=w.sources.map(s=>link(s.url,s.site+' 作品资料')).join('');$('frames').textContent='正在载入…';$('detail').showModal();
 try{if(!cache.has(id)){const records=await new Promise((resolve,reject)=>{const tag=document.createElement('script');tag.src='d4/'+encodeURIComponent(id)+'.js';tag.onload=()=>{resolve(window.FILM_SOURCE_FRAMES);tag.remove();};tag.onerror=()=>{tag.remove();reject(new Error('来源分片载入失败，请保留同名数据文件夹并重试。'));};document.head.appendChild(tag);});cache.set(id,records);}
 if(token!==requestId)return;frames=cache.get(id);fpage=0;renderFrames();}catch(e){if(token===requestId)$('frames').textContent=e.message;}}
$('close').onclick=()=>{requestId++;$('detail').close();};$('detail').addEventListener('cancel',()=>requestId++);
$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('fprev').onclick=()=>{fpage--;renderFrames();};$('fnext').onclick=()=>{fpage++;renderFrames();};
let timer;$('q').oninput=()=>{clearTimeout(timer);timer=setTimeout(filter,150);};$('coverage').onchange=filter;$('type').onchange=filter;
if(S&&WORKS.length){$('stats').innerHTML=`<span><b>${S.catalogue_works.toLocaleString()}</b> 部作品目录</span><span><b>${S.frame_references.toLocaleString()}</b> 条来源画面参考</span><span><b>${S.description_shots.toLocaleString()}</b> 条既有镜头描述</span>`;$('date').textContent=`资料获取日期 ${S.date} · ${S.sourced_works.toLocaleString()} 部有外部作品资料 · ${S.frame_works.toLocaleString()} 部有画面参考`;filter();}else{$('error').textContent='数据未载入，请确认影视来源目录_data 文件夹完整。';}
</script></body></html>
