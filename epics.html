function applyPrompts() {
  const rawQ = $('qPrompt').value.trim().toLowerCase();
  const tokens = rawQ ? rawQ.split(/\s+/).filter(Boolean) : [];
  const bch = $('selBatch').value;
  const era = $('selEra').value;
  const tp = $('selType').value;
  const sortMode = $('sortPrompt').value;
  const list = ITEMS.filter(r => {
    if (curGroupNo && r.gno !== curGroupNo) return false;
    if (bch && r.batch !== bch) return false;
    if (curCat && r.category !== curCat) return false;
    if (era && r.era !== era) return false;
    if (tp && r.asset_type !== tp) return false;
    if (tokens.length) {
      const hay = (r.id + ' ' + r.code + ' ' + r.category + ' ' + r.work_name + ' ' + r.sub_genre + ' ' + r.era + ' ' + r.place + ' ' + r.title + ' ' + r.characters + ' ' + r.scenes + ' ' + r.props + ' ' + r.companion + ' ' + r.basis + ' ' + r.prompt).toLowerCase();
      for (const tk of tokens) { if (!hay.includes(tk)) return false; }
    }
    return true;
  });
  const TYPE_ORDER = {'角色':1, '场景':2, '道具':3, '配套':4};
  filtered = list.slice().sort((a,b) => {
    if (sortMode === 'seq_desc') return b.seq - a.seq;
    if (sortMode === 'era') {
      const ea = (a.era in ERA_ORDER) ? ERA_ORDER[a.era] : 9, eb = (b.era in ERA_ORDER) ? ERA_ORDER[b.era] : 9;
      if (ea !== eb) return ea - eb;
      return a.seq - b.seq;
    }
    if (sortMode === 'type') {
      const ta = TYPE_ORDER[a.asset_type] || 9, tb = TYPE_ORDER[b.asset_type] || 9;
      if (ta !== tb) return ta - tb;
      return a.seq - b.seq;
    }
    return a.seq - b.seq;
  });
  renderPrompts();
}

  window.scrollTo({top:0, behavior:'smooth'});
}

function renderExisting() {
  const rawQ = $('qExist').value.trim().toLowerCase();
  const tokens = rawQ ? rawQ.split(/\s+/).filter(Boolean) : [];
  const subF = $('subExist').value;
  const g = $('existGrid');
  g.innerHTML = '';
  RAW.existing.filter(r => {
    if (subF && !r.title.includes(subF) && !r.sub.includes(subF)) return false;
    if (tokens.length) {
      const hay = (r.id + ' ' + r.title + ' ' + r.sub + ' ' + r.story + ' ' + r.brief + ' ' + r.variants.map(v=>v.p).join(' ')).toLowerCase();
      for (const tk of tokens) { if (!hay.includes(tk)) return false; }
    }
    return true;
  }).forEach((r, idx) => {
    const d = document.createElement('div');
    d.className = 'card';
    const opts = r.variants.map((v, vi) => `<option value="${vi}">视角 ${vi+1}：${v.label}（${v.ratio}）</option>`).join('');
    d.innerHTML = `
      <h3>${idx+1}. ${r.title}</h3>
      <div><span class="tag book">${r.sub}</span> <span class="tag role">事件 HERO 关键帧</span> <span class="tag">${r.id}（${r.vcount}条提示词）</span></div>
      <div class="box"><b>典故摘要：</b>${r.brief} ｜ <b>所属故事：</b>${r.story}</div>
      <select onchange="document.getElementById('ex_${idx}').value = RAW.existing[${idx}].variants[this.value].p">${opts}</select>
      <textarea readonly id="ex_${idx}">${r.variants[0] ? r.variants[0].p : ''}</textarea>
      <div class="bar" style="margin:4px 0">
        <button class="primary" onclick="copyText('ex_${idx}', false)">复制当前视角提示词</button>
        <button class="gold" onclick="copyText('ex_${idx}', true)">复制并打开 GPT Image 2</button>
      </div>
    `;
    g.appendChild(d);
  });
}

async function copyText(id, openJm) {
  const el = $(id);
  try { await navigator.clipboard.writeText(el.value); } catch(e) { el.select(); document.execCommand('copy'); }
  if (openJm) window.open(JIMENG, '_blank');
}

function exportFilteredTxt() {
  const txt = filtered.map(r => `【${r.id}｜${r.code} ${r.title}｜${r.category}｜${r.era}】\n出处：${r.basis}\n${r.prompt}`).join('\n\n=====\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain;charset=utf-8'}));
  a.download = `中国古典文学名著与多民族史诗总集_${filtered.length}条提示词.txt`;
  a.click();
}

$('qWork').oninput = renderWorks;
$('batchWork').onchange = renderWorks;
$('catWork').onchange = renderWorks;
$('eraWork').onchange = renderWorks;
$('sortWork').onchange = renderWorks;
$('qPrompt').oninput = () => { page = 0; applyPrompts(); };
$('selBatch').onchange = () => { page = 0; applyPrompts(); };
$('selEra').onchange = () => { page = 0; applyPrompts(); };
$('selType').onchange = () => { page = 0; applyPrompts(); };
$('sortPrompt').onchange = () => { page = 0; applyPrompts(); };
$('qExist').oninput = renderExisting;
$('subExist').onchange = renderExisting;
hydrateSpecialistPage();
</script>
