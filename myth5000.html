async function hydrateSpecialistPage(){
  if(document.getElementById('jt_gate_css')&&document.documentElement.getAttribute('data-jt-ok')!=='1')return;
  const stEl=document.getElementById('count');
  if(stEl)stEl.textContent='正在并行载入考证专集数据分片…';
  window.SPEC_ALL_MANIFEST=null;
  await loadSpecAllRes('manifest.js?v='+Date.now(),true,()=>{if(!window.SPEC_ALL_MANIFEST)throw new Error('mf');});
  const mf=window.SPEC_ALL_MANIFEST,shards=(mf&&Array.isArray(mf.item_shards))?mf.item_shards:[],ver=mf&&mf.version?('?v='+mf.version):'';
  const queue=(mf&&mf.meta_shard)?[mf.meta_shard,...shards]:[...shards];
  let nextIdx=0,doneCnt=0;
  const workers=Array.from({length:Math.min(6,queue.length||1)},async()=>{while(nextIdx<queue.length){const sh=queue[nextIdx++];await loadSpecAllRes(sh+ver,false,()=>{if(!window.__SPEC_ALL_CHUNKS__[sh])throw new Error('chunk');});doneCnt++;if(stEl)stEl.textContent=`正在并行解压专集分片（${doneCnt} / ${queue.length}）…`;}});
  await Promise.all(workers);
  DATA.length=0;
  for(let i=0;i<shards.length;i++){const rows=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[shards[i]]);for(let j=0;j<rows.length;j++)DATA.push(rows[j]);delete window.__SPEC_ALL_CHUNKS__[shards[i]];}
  list=DATA;
  initFilters();
  apply();
}
/*__SPEC_ALL_SHARD_END__*/
let fGrp='',fState='',page=0,PAGE=24,list=DATA;
const $=id=>document.getElementById(id);
const GRP_ORDER={'创世与上古帝王':1,'山海经神兽与异人':2,'道教神仙体系':3,'佛教形象与冥界':4,'西游封神神魔':5,'民间传说与楚辞九歌':6,'少数民族神话与史诗':7,'仙宫神域与神话地理':8,'神器法宝':9};

function initFilters(){
  const stateCnt={},grpCnt={};
  DATA.forEach(r=>{
    const st=r.state||'标准态';
    stateCnt[st]=(stateCnt[st]||0)+1;
    grpCnt[r.grp]=(grpCnt[r.grp]||0)+1;
  });
  document.querySelectorAll('#grpRow .chip').forEach(c=>{const k=c.dataset.grp;const base=c.textContent.replace(/（\d+）$/,'');c.textContent=`${base}（${k?(grpCnt[k]||0):DATA.length}）`;});
  const sr=$('stateRow');
  let html='<b>二、场景状态</b><span class="chip on" data-state="">全部状态（'+DATA.length+'）</span>';
  Object.entries(stateCnt).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
    html+=`<span class="chip" data-state="${k}">${k}（${v}）</span>`;
  });
  sr.innerHTML=html;
  document.querySelectorAll('#stateRow .chip').forEach(c=>c.onclick=()=>{
    fState=c.dataset.state;
    document.querySelectorAll('#stateRow .chip').forEach(x=>x.classList.toggle('on',x===c));
    apply();
  });
}

function apply(){
  const rawQ=$('q').value.trim().toLowerCase();
  const tokens=rawQ?rawQ.split(/\s+/).filter(Boolean):[];
  const sortMode=$('sort')?$('sort').value:'grp';
  const filtered=DATA.filter(r=>{
    if(fGrp && r.grp!==fGrp) return false;
    if(fState && (r.state||'标准态')!==fState) return false;
    if(tokens.length){
      const hay=(r.id+' '+r.title+' '+r.grp+' '+(r.state||'')+' '+r.src+' '+r.brief+' '+r.c).toLowerCase();
      for(const tk of tokens){ if(!hay.includes(tk)) return false; }
    }
    return true;
  });
  list=filtered.slice().sort((a,b)=>{
    if(sortMode==='grp'){
      const ga=GRP_ORDER[a.grp]||99, gb=GRP_ORDER[b.grp]||99;
      if(ga!==gb) return ga-gb;
      return a.id.localeCompare(b.id);
    }
    if(sortMode==='id_desc') return b.id.localeCompare(a.id);
    if(sortMode==='title') return a.title.localeCompare(b.title,'zh-Hans-CN');
    return a.id.localeCompare(b.id);
  });
  page=0;render();
}
function render(){
  const n=list.length, pages=Math.max(1,Math.ceil(n/PAGE));
  if(page>=pages) page=pages-1;
  const np=list.reduce((s,r)=>s+r.variants.length,0);$('count').textContent=`当前匹配 ${n} 个神话条目 · ${np} 条提示词`;
  $('pageInfo').textContent=`第 ${page+1} / ${pages} 页`;
  $('pageInfo2').textContent=`第 ${page+1} / ${pages} 页`;
  $('goto').max=pages;$('goto').value=page+1;
  $('prev').disabled=$('prev2').disabled=(page===0);
  $('next').disabled=$('next2').disabled=(page>=pages-1);
  const g=$('grid');g.innerHTML='';
  list.slice(page*PAGE,(page+1)*PAGE).forEach((r,idx)=>{
    const cardIdx=page*PAGE+idx;
    const c=document.createElement('div');c.className='card';
    const opts=r.variants.map((v,i)=>`<option value="${i}">${v.label}（画幅 ${v.ratio}）</option>`).join('');
    c.innerHTML=`
      <h3>${r.title}</h3>
      <div>
        <span class="tag era">神话与传说 · ${r.grp}</span>
        <span class="tag">${r.id}</span>
        <span class="tag">${r.state||'标准态'} · ${r.variants.length} 机位</span>
      </div>
      <div class="meta"><b>典籍与文物考证：</b>${r.src}</div>
      <div style="font-size:15pt">${r.brief}</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label style="font-size:15pt">机位：</label>
        <select onchange="sw(${cardIdx},this.value)">${opts}</select>
        <button class="primary" onclick="cp(${cardIdx},false)">复制提示词</button>
        <button class="red" onclick="cp(${cardIdx},true)">复制并打开 GPT Image 2</button>
        <span id="m_${cardIdx}" style="font-size:15pt;color:#284b45;font-weight:bold"></span>
      </div>
      <textarea readonly id="t_${cardIdx}">${r.variants[0].p}</textarea>
    `;
    g.appendChild(c);
  });
}
window.sw=function(cardIdx,vIdx){$('t_'+cardIdx).value=list[cardIdx].variants[parseInt(vIdx,10)].p;};
window.cp=async function(cardIdx,openJm){
  const el=$('t_'+cardIdx),msg=$('m_'+cardIdx);
  try{await navigator.clipboard.writeText(el.value);}catch(e){el.select();document.execCommand('copy');}
  msg.textContent=openJm?'✓ 已复制并打开 GPT Image 2':'✓ 已复制';
  if(openJm) window.open(JIMENG,'_blank');
};
document.querySelectorAll('#grpRow .chip').forEach(c=>c.onclick=()=>{
  fGrp=c.dataset.grp;
  document.querySelectorAll('#grpRow .chip').forEach(x=>x.classList.toggle('on',x===c));
  apply();
});
$('q').oninput=apply;
$('sort').onchange=apply;
$('reset').onclick=()=>{
  fGrp='';fState='';$('q').value='';$('sort').value='grp';
  document.querySelectorAll('#grpRow .chip').forEach(x=>x.classList.toggle('on',x.dataset.grp===''));
  document.querySelectorAll('#stateRow .chip').forEach(x=>x.classList.toggle('on',x.dataset.state===''));
  apply();
};
$('prev').onclick=$('prev2').onclick=()=>{page--;render();window.scrollTo({top:0,behavior:'smooth'});};
$('next').onclick=$('next2').onclick=()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'});};
$('goPage').onclick=()=>{const v=parseInt($('goto').value,10);if(!isNaN(v)){page=Math.max(0,v-1);render();window.scrollTo({top:0,behavior:'smooth'});}};
$('psize').onchange=()=>{PAGE=parseInt($('psize').value,10);page=0;render();};
$('exportTxt').onclick=()=>{
  const txt=list.map(r=>r.variants.map(v=>`【${r.id} ${r.title} · ${v.label} · ${v.ratio}】\n考证：${r.src}\n${v.p}`).join('\n\n')).join('\n\n=====\n\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));
  a.download=`神话传说_${list.length}条目_${list.reduce((s,r)=>s+r.variants.length,0)}提示词.txt`;
  a.click();
};
hydrateSpecialistPage();
</script>
