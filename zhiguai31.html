const SPEC_ALL_LOCAL='zhiguai_data/',SPEC_ALL_RAW='https://raw.githubusercontent.com/aikingtai-ctrl/jintai-history-image-library/main/zhiguai_data/',SPEC_ALL_CDN='https://testingcf.jsdelivr.net/gh/aikingtai-ctrl/jintai-history-image-library@main/zhiguai_data/',IS_GH_SPEC_ALL=/github\.io$/i.test(location.hostname||'');
function loadSpecAllTag(url,checkFn,ms){return new Promise(res=>{const t=document.createElement('script');let done=false;const fin=ok=>{if(done)return;done=true;clearTimeout(tm);t.remove();if(!ok){res(false);return;}try{checkFn();res(true);}catch{res(false);}};const tm=setTimeout(()=>fin(false),ms||15000);t.src=url;t.onload=()=>fin(true);t.onerror=()=>fin(false);document.head.appendChild(t);});}
async function loadSpecAllRes(relName,isManifest,checkFn){
  const clean=String(relName).split('?')[0];
  if(location.protocol==='file:'){if(await loadSpecAllTag(SPEC_ALL_LOCAL+relName,checkFn,15000))return true;if(clean!==relName&&await loadSpecAllTag(SPEC_ALL_LOCAL+clean,checkFn,15000))return true;throw new Error('local-file-'+clean);}
  if(!IS_GH_SPEC_ALL){if(await loadSpecAllTag(SPEC_ALL_LOCAL+relName,checkFn,15000))return true;}
  else if(isManifest){if(await loadSpecAllTag(SPEC_ALL_LOCAL+relName,checkFn,12000))return true;}
  for(const u of [SPEC_ALL_RAW+clean,SPEC_ALL_CDN+clean]){try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),20000);const r=await fetch(u,{signal:ctl.signal});clearTimeout(tm);if(!r.ok)continue;const txt=await r.text();(new Function(txt))();checkFn();return true;}catch(e){}}
  if(await loadSpecAllTag(SPEC_ALL_LOCAL+relName,checkFn,12000))return true;
  throw new Error('spec-all-load-'+clean);
}
async function hydrateSpecialistPage(){
  if(document.getElementById('jt_gate_css')&&document.documentElement.getAttribute('data-jt-ok')!=='1')return;
  const stEl=document.getElementById('pCount');
  if(stEl)stEl.textContent='正在并行载入考证专集数据分片…';
  window.SPEC_ALL_MANIFEST=null;
  await loadSpecAllRes('manifest.js?v='+Date.now(),true,()=>{if(!window.SPEC_ALL_MANIFEST)throw new Error('mf');});
  const mf=window.SPEC_ALL_MANIFEST,shards=(mf&&Array.isArray(mf.item_shards))?mf.item_shards:[],ver=mf&&mf.version?('?v='+mf.version):'';
  const queue=(mf&&mf.meta_shard)?[mf.meta_shard,...shards]:[...shards];
  let nextIdx=0,doneCnt=0;
  const workers=Array.from({length:Math.min(6,queue.length||1)},async()=>{while(nextIdx<queue.length){const sh=queue[nextIdx++];await loadSpecAllRes(sh+ver,false,()=>{if(!window.__SPEC_ALL_CHUNKS__[sh])throw new Error('chunk');});doneCnt++;if(stEl)stEl.textContent=`正在并行解压专集分片（${doneCnt} / ${queue.length}）…`;}});
  await Promise.all(workers);
  const meta=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[mf.meta_shard]);delete window.__SPEC_ALL_CHUNKS__[mf.meta_shard];
  RAW.books=meta.books||[];
  RAW.groups=meta.groups||[];
  RAW.existing=meta.existing||[];
  RAW.total_existing=meta.total_existing||0;
  RAW.items=[];
  for(let i=0;i<shards.length;i++){const rows=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[shards[i]]);for(let j=0;j<rows.length;j++)RAW.items.push(rows[j]);delete window.__SPEC_ALL_CHUNKS__[shards[i]];}
  ITEMS.length=0;
  for(let i=0;i<RAW.items.length;i++)ITEMS.push(_mapZgItem(RAW.items[i]));
  filtered=ITEMS;
  initChips();
  renderBooks();
  applyPrompts();
  renderExisting();
}
/*__SPEC_ALL_SHARD_END__*/
const JIMENG = 'https://chatgpt.com/';
const _mapZgItem = x => {
  const g = RAW.groups[x[2]];
  return {
    seq: x[0], id: x[1], gid: g[0], book_no: g[1], book: g[2], author_era: g[3],
    era: g[4], story: g[5], characters: g[6], scenes: g[7], props: g[8],
    basis: g[9], url: g[10], asset_type: x[3], sub_type: x[4], label: x[5],
    ratio: x[6], title: x[7], prompt: x[8]
  };
};
const ITEMS = RAW.items.map(_mapZgItem);
let curBookNo = 0, page = 0, PAGE_SIZE = 40, filtered = ITEMS;
const $ = id => document.getElementById(id);

function setTab(t) {
  $('tabBooks').classList.toggle('on', t==='books');
  $('tabPrompts').classList.toggle('on', t==='prompts');
  $('tabExisting').classList.toggle('on', t==='existing');
  $('secBooks').style.display = t==='books' ? '' : 'none';
  $('secPrompts').style.display = t==='prompts' ? '' : 'none';
  $('secExisting').style.display = t==='existing' ? '' : 'none';
}

function renderBooks() {
  const rawQ = $('qBook').value.trim().toLowerCase();
  const tokens = rawQ ? rawQ.split(/\s+/).filter(Boolean) : [];
  const cat = $('catBook').value;
  const sortMode = $('sortBook') ? $('sortBook').value : 'bno';
  const g = $('bookGrid');
  g.innerHTML = '';
  const books = RAW.books.filter(b => {
    if (cat && !b.category.includes(cat)) return false;
    if (tokens.length) {
      const hay = (b.book + ' ' + b.author_era + ' ' + b.themes + ' ' + b.stories.join(' ') + ' ' + b.characters.join(' ') + ' ' + b.scenes.join(' ') + ' ' + b.props.join(' ')).toLowerCase();
      for (const tk of tokens) { if (!hay.includes(tk)) return false; }
    }
    return true;
  }).slice().sort((a,b) => {
    if (sortMode === 'cat') {
      if (a.category !== b.category) return a.category.localeCompare(b.category, 'zh-Hans-CN');
      return a.book_no - b.book_no;
    }
    if (sortMode === 'count_desc') {
      const ca = a.group_count * 10 + a.existing_count, cb = b.group_count * 10 + b.existing_count;
      if (ca !== cb) return cb - ca;
      return a.book_no - b.book_no;
    }
    return a.book_no - b.book_no;
  });
  books.forEach(b => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `
      <h3>${b.book_no}. ${b.book} <span class="tag book">${b.author_era}</span> <span class="tag">${b.category}</span></h3>
      <div><span class="tag role">核心母题：${b.themes}</span> <span class="tag">新增 ${b.group_count} 组 / ${b.group_count*10} 条提示词</span> <span class="tag">全库既有 ${b.existing_count} 条目</span></div>
      <div class="box"><b>代表篇章（${b.stories.length}篇）：</b>${b.stories.join('、')}</div>
      <div class="box"><b>归拢角色（人物/神魔/仙佛/鬼狐）：</b>${b.characters.join('；')}</div>
      <div class="box"><b>归拢场景（实景/幽冥/幻境/洞天）：</b>${b.scenes.join('；')}</div>
      <div class="box"><b>归拢道具（法宝/经像/丹鼎/信物）：</b>${b.props.join('；')}</div>
      <div class="box"><b>大型配套（舟船/舆辇/阵法/建筑）：</b>${b.vehicles.join('；')}</div>
      <div><button class="primary" onclick="jumpBook(${b.book_no})">查看${b.book}全部 ${b.group_count*10} 条角色/场景/道具提示词 →</button></div>
    `;
    g.appendChild(d);
  });
}

function initChips() {
  const box = $('bookChips');
  let html = `<span class="chip on" data-bno="0" onclick="pickBook(0)">全部57部古籍（${ITEMS.length}条）</span>`;
  RAW.books.forEach(b => {
    html += `<span class="chip" data-bno="${b.book_no}" onclick="pickBook(${b.book_no})">${b.book_no}.${b.book}（${b.group_count*10}）</span>`;
  });
  box.innerHTML = html;
}

function pickBook(bno) {
  curBookNo = bno;
  document.querySelectorAll('#bookChips .chip').forEach(c => c.classList.toggle('on', parseInt(c.dataset.bno,10)===bno));
  page = 0;
  applyPrompts();
}

function jumpBook(bno) {
  setTab('prompts');
  pickBook(bno);
  window.scrollTo({top:0, behavior:'smooth'});
}

function resetPromptFilter() {
  $('qPrompt').value = '';
  $('selType').value = '';
  if ($('selBatch')) $('selBatch').value = '';
  if ($('sortPrompt')) $('sortPrompt').value = 'book';
  pickBook(0);
}

function applyPrompts() {
  const rawQ = $('qPrompt').value.trim().toLowerCase();
  const tokens = rawQ ? rawQ.split(/\s+/).filter(Boolean) : [];
  const tp = $('selType').value;
  const bat = $('selBatch') ? $('selBatch').value : '';
  const sortMode = $('sortPrompt') ? $('sortPrompt').value : 'book';
  const list = ITEMS.filter(r => {
    if (curBookNo && r.book_no !== curBookNo) return false;
    if (tp && r.asset_type !== tp) return false;
    if (bat) {
      const bNum = Math.ceil(r.seq / 2000);
      if (String(bNum) !== bat) return false;
    }
    if (tokens.length) {
      const hay = (r.id + ' ' + r.book + ' ' + r.author_era + ' ' + r.story + ' ' + r.title + ' ' + r.characters + ' ' + r.scenes + ' ' + r.props + ' ' + r.prompt).toLowerCase();
      for (const tk of tokens) { if (!hay.includes(tk)) return false; }
    }
    return true;
  });
  const TYPE_ORDER = {'角色':1, '场景':2, '道具':3, '配套':4};
  filtered = list.slice().sort((a,b) => {
    if (sortMode === 'book') {
      if (a.book_no !== b.book_no) return a.book_no - b.book_no;
      return a.seq - b.seq;
    }
    if (sortMode === 'seq_desc') return b.seq - a.seq;
    if (sortMode === 'type') {
      const ta = TYPE_ORDER[a.asset_type] || 9, tb = TYPE_ORDER[b.asset_type] || 9;
      if (ta !== tb) return ta - tb;
      if (a.book_no !== b.book_no) return a.book_no - b.book_no;
      return a.seq - b.seq;
    }
    return a.seq - b.seq;
  });
  renderPrompts();
}

function renderPrompts() {
  const total = filtered.length, pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (page >= pages) page = pages - 1;
  $('pCount').textContent = `当前筛选 ${total} 条提示词（总计 ${ITEMS.length} 条）`;
  $('pInfo').textContent = `第 ${page+1} / ${pages} 页`;
  $('prevBtn').disabled = page <= 0;
  $('nextBtn').disabled = page >= pages - 1;
  const g = $('promptGrid');
  g.innerHTML = '';
  filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE).forEach(r => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `
      <h3>${r.seq}. ${r.title}</h3>
      <div>
        <span class="tag book">${r.book_no}.${r.book}（${r.author_era}）</span>
        <span class="tag role">${r.asset_type} · ${r.sub_type}</span>
        <span class="tag">画幅 ${r.ratio}</span>
        <span class="tag">${r.id}</span>
      </div>
      <div class="box">
        <div><b>关联角色：</b>${r.characters}</div>
        <div><b>关联场景：</b>${r.scenes}</div>
        <div><b>关联道具：</b>${r.props}</div>
        <div><b>原典依据：</b>${r.basis}</div>
      </div>
      <textarea readonly id="pt_${r.seq}">${r.prompt}</textarea>
      <div class="bar" style="margin:4px 0">
        <button class="primary" onclick="copyText('pt_${r.seq}', false)">复制十二段提示词</button>
        <button class="gold" onclick="copyText('pt_${r.seq}', true)">复制并打开 GPT Image 2</button>
      </div>
    `;
    g.appendChild(d);
  });
}

function chgPage(delta) {
  page += delta;
  renderPrompts();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderExisting() {
  const rawQ = $('qExist').value.trim().toLowerCase();
  const tokens = rawQ ? rawQ.split(/\s+/).filter(Boolean) : [];
  const g = $('existGrid');
  g.innerHTML = '';
  RAW.existing.filter(r => {
    if (!tokens.length) return true;
    const hay = (r.book + ' ' + r.title + ' ' + r.brief + ' ' + r.src + ' ' + r.p).toLowerCase();
    for (const tk of tokens) { if (!hay.includes(tk)) return false; }
    return true;
  }).slice(0, 300).forEach((r, idx) => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `
      <h3>${r.title}</h3>
      <div><span class="tag book">${r.book}</span> <span class="tag role">${r.kind}</span> <span class="tag">${r.era}</span> <span class="tag">${r.id}（${r.vcount}视角）</span></div>
      <div class="box"><b>资产摘要：</b>${r.brief}<br><b>出处考证：</b>${r.src}</div>
      <textarea readonly id="ex_${idx}">${r.p}</textarea>
      <div><button class="primary" onclick="copyText('ex_${idx}', false)">复制首视角提示词</button></div>
    `;
    g.appendChild(d);
  });
}

async function copyText(id, openJm) {
  const el = $(id);
  try { await navigator.clipboard.writeText(el.value); } catch(e) { el.select(); document.execCommand('copy'); }
  if (openJm) window.open(JIMENG, '_blank');
}

function exportFilteredTxt() {
  const txt = filtered.map(r => `【${r.id}｜${r.book}${r.story}｜${r.asset_type}·${r.sub_type}】\n角色：${r.characters}\n场景：${r.scenes}\n道具：${r.props}\n出处：${r.basis}\n${r.prompt}`).join('\n\n=====\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain;charset=utf-8'}));
  a.download = `古代志怪佛道仙传传奇神魔57部总集_${filtered.length}条提示词.txt`;
  a.click();
}

$('qBook').oninput = renderBooks;
$('catBook').onchange = renderBooks;
$('sortBook').onchange = renderBooks;
$('qPrompt').oninput = () => { page = 0; applyPrompts(); };
$('selBatch').onchange = () => { page = 0; applyPrompts(); };
$('selType').onchange = () => { page = 0; applyPrompts(); };
$('sortPrompt').onchange = () => { page = 0; applyPrompts(); };
$('qExist').oninput = renderExisting;
hydrateSpecialistPage();
</script>
