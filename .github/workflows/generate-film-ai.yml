name: Generate film AI previews

on:
  workflow_dispatch:
    inputs:
      page:
        description: "默认排序页码（每页最多 100 部）"
        required: true
        default: "1"
      count:
        description: "本次生成数量（1-100）"
        required: true
        default: "100"
      start_index:
        description: "批量起始作品序号（留空则按页码）"
        required: false
        default: ""
      end_index:
        description: "批量结束作品序号（含；每次最多 500 部）"
        required: false
        default: ""
      force:
        description: "覆盖已有图片"
        required: true
        type: boolean
        default: false
      target_batch:
        description: "继续固定的 3000 部作品清单"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: film-ai-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        run: |
          git clone --filter=blob:none --sparse --depth=1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" .
          git sparse-checkout set --no-cone /film.html /film-ai/ /tools/ /d3/vworks.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select next scheduled range
        if: github.event_name == 'schedule' || inputs.target_batch == true
        id: choose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node film-ai/select-next-range.mjs

      - name: Load selected first-shot descriptions
        if: steps.choose.outputs.run == 'true' || (github.event_name == 'workflow_dispatch' && inputs.target_batch != true)
        env:
          INPUT_PAGE: ${{ inputs.page }}
          INPUT_COUNT: ${{ inputs.count }}
          INPUT_START_INDEX: ${{ steps.choose.outputs.start_index || inputs.start_index }}
          INPUT_END_INDEX: ${{ steps.choose.outputs.end_index || inputs.end_index }}
          TARGET_BATCH: ${{ github.event_name == 'schedule' || inputs.target_batch }}
        run: |
          args=(--page "$INPUT_PAGE" --count "$INPUT_COUNT")
          if [ -n "$INPUT_START_INDEX" ]; then args=(--start-index "$INPUT_START_INDEX" --end-index "$INPUT_END_INDEX"); fi
          if [ "$TARGET_BATCH" = "true" ]; then args+=(--target-file film-ai/target-3000.txt); fi
          mapfile -t ids < <(node tools/generate_film_ai_previews.mjs "${args[@]}" --dry-run | tail -n +2 | cut -f1)
          if [ "${#ids[@]}" -eq 0 ]; then echo 'No works selected.'; exit 1; fi
          patterns=(/film.html /film-ai/ /tools/ /d3/vworks.js)
          for wid in "${ids[@]}"; do patterns+=("/d4/p_${wid}.js"); done
          git sparse-checkout set --no-cone "${patterns[@]}"

      - name: Generate images
        if: steps.choose.outputs.run == 'true' || (github.event_name == 'workflow_dispatch' && inputs.target_batch != true)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INPUT_PAGE: ${{ inputs.page }}
          INPUT_COUNT: ${{ inputs.count }}
          INPUT_START_INDEX: ${{ steps.choose.outputs.start_index || inputs.start_index }}
          INPUT_END_INDEX: ${{ steps.choose.outputs.end_index || inputs.end_index }}
          INPUT_FORCE: ${{ inputs.force }}
          TARGET_BATCH: ${{ github.event_name == 'schedule' || inputs.target_batch }}
        run: |
          args=(--page "$INPUT_PAGE" --count "$INPUT_COUNT")
          if [ -n "$INPUT_START_INDEX" ]; then
            args=(--start-index "$INPUT_START_INDEX" --end-index "$INPUT_END_INDEX" --concurrency 8)
          fi
          if [ "$TARGET_BATCH" = "true" ]; then
            args+=(--target-file film-ai/target-3000.txt)
          fi
          if [ "$INPUT_FORCE" = "true" ]; then args+=(--force); fi
          node tools/generate_film_ai_previews.mjs "${args[@]}"

      - name: Commit generated images
        if: always() && (steps.choose.outputs.run == 'true' || (github.event_name == 'workflow_dispatch' && inputs.target_batch != true))
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_START_INDEX: ${{ inputs.start_index }}
          INPUT_END_INDEX: ${{ inputs.end_index }}
          INPUT_PAGE: ${{ inputs.page }}
        run: |
          git config user.name "film-ai-generator[bot]"
          git config user.email "film-ai-generator[bot]@users.noreply.github.com"
          git add -A -- film-ai
          if git diff --cached --quiet; then
            echo "No new images to commit."
            exit 0
          fi
          node - <<'NODE'
          const fs = require('fs');
          const file = 'film.html';
          const source = fs.readFileSync(file, 'utf8');
          const updated = source.replace(/film-ai\/manifest\.js\?v=[^"']+/, `film-ai/manifest.js?v=run-${process.env.GITHUB_RUN_ID}`);
          if (updated === source) throw new Error('Manifest script tag not found');
          fs.writeFileSync(file, updated);
          NODE
          git add film.html
          git commit -m "Generate film AI previews ${INPUT_START_INDEX}-${INPUT_END_INDEX} page ${INPUT_PAGE}"
          gh auth setup-git
          if ! git push origin HEAD:main; then
            git push origin "HEAD:refs/heads/codex/film-ai-bulk-${GITHUB_RUN_ID}"
            echo "Main advanced; generated images are preserved on a codex/film-ai-bulk branch."
            exit 1
          fi
          gh workflow run pages.yml --ref main
