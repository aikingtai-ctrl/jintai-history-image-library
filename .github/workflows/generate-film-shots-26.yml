name: Generate film shot references with GPT Image 2.6

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "Position in the fixed shot target list (1-based)"
        required: true
        default: "1"
      count:
        description: "Number of shots (1-100)"
        required: true
        default: "1"
      concurrency:
        description: "Concurrent Images API calls (1-4)"
        required: true
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: film-shot-image-26
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Sparse checkout shot inputs
        env:
          GH_TOKEN: ${{ github.token }}
          START_INDEX: ${{ inputs.start_index }}
          COUNT: ${{ inputs.count }}
        run: |
          git clone --filter=blob:none --sparse --depth=1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git sparse-checkout set --no-cone \
            /tools/generate_film_shot_images_26.mjs \
            /film-ai/shot-targets-20261112.json \
            /film-ai/shots-manifest.js \
            /film-ai/shots-ledger-26.jsonl
          mapfile -t ids < <(node -e 'const a=require("./film-ai/shot-targets-20261112.json"); const s=Number(process.env.START_INDEX)-1; const n=Number(process.env.COUNT); for(const x of a.slice(s,s+n)) console.log(x.id)')
          patterns=(/tools/generate_film_shot_images_26.mjs /film-ai/shot-targets-20261112.json /film-ai/shots-manifest.js /film-ai/shots-ledger-26.jsonl)
          for id in "${ids[@]}"; do patterns+=("/film-ai/shots/${id}.webp"); done
          git sparse-checkout set --no-cone "${patterns[@]}"
      - name: Generate verified WebP images in target order
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          START_INDEX: ${{ inputs.start_index }}
          COUNT: ${{ inputs.count }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          node tools/generate_film_shot_images_26.mjs \
            --start-index "$START_INDEX" --count "$COUNT" --concurrency "$CONCURRENCY"

      - name: Publish images and manifest to latest main
        env:
          GH_TOKEN: ${{ github.token }}
          START_INDEX: ${{ inputs.start_index }}
          COUNT: ${{ inputs.count }}
        run: |
          set -euo pipefail
          mapfile -t ids < <(node -e 'const a=require("./film-ai/shot-targets-20261112.json"); const s=Number(process.env.START_INDEX)-1; const n=Number(process.env.COUNT); for(const x of a.slice(s,s+n)) console.log(x.id)')
          test "${#ids[@]}" -eq "$COUNT"
          for attempt in 1 2 3 4; do
            publish_dir="$(mktemp -d)"
            git clone --filter=blob:none --sparse --depth=1 --branch main \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$publish_dir"
            patterns=(/film-ai/shots-manifest.js /film-ai/shots-ledger-26.jsonl)
            for id in "${ids[@]}"; do patterns+=("/film-ai/shots/${id}.webp"); done
            git -C "$publish_dir" sparse-checkout set --no-cone "${patterns[@]}"
            mkdir -p "$publish_dir/film-ai/shots"
            cp film-ai/shots-manifest.js "$publish_dir/film-ai/shots-manifest.js"
            cp film-ai/shots-ledger-26.jsonl "$publish_dir/film-ai/shots-ledger-26.jsonl"
            paths=(film-ai/shots-manifest.js film-ai/shots-ledger-26.jsonl)
            for id in "${ids[@]}"; do
              cp "film-ai/shots/${id}.webp" "$publish_dir/film-ai/shots/${id}.webp"
              paths+=("film-ai/shots/${id}.webp")
            done
            git -C "$publish_dir" add -- "${paths[@]}"
            if git -C "$publish_dir" diff --cached --quiet; then
              echo 'All selected GPT Image 2.6 images are already on main.'
              exit 0
            fi
            git -C "$publish_dir" config user.name 'film-shot-image-26[bot]'
            git -C "$publish_dir" config user.email 'film-shot-image-26[bot]@users.noreply.github.com'
            git -C "$publish_dir" commit -m "Generate film shot references ${START_INDEX}+${COUNT} with GPT Image 2.6 Sunburst"
            if git -C "$publish_dir" push origin HEAD:main; then
              gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
              exit 0
            fi
            echo "Main advanced; retrying publish ($attempt/4)."
          done
          exit 1
