name: Deploy GitHub Pages (Lean Shell + Active Index)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "film-ai/shots/**"
      - "film-ai/shots-manifest.js"
      - "film-ai/shots-ledger-26.jsonl"
      - "film-ai/*.jpg"
      - "film-ai/*.png"
      - "film-ai/*.webp"
      - "film-ai/restored/**"
      - "history-ai/thumbnails/**"
      - "history-ai/regenerated-previews/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Single-pack sparse clone and stage lean _site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

          python3 - <<'PY'
          import gzip, hashlib, json, pathlib, re, shutil, subprocess

          repo = pathlib.Path("repo")
          site = pathlib.Path("_site")
          site.mkdir(parents=True, exist_ok=True)

          def git_bytes(*args):
              return subprocess.check_output(["git", "-C", str(repo), *args])

          idx_html = git_bytes("show", "HEAD:index.html").decode("utf-8", errors="ignore")
          brw_html = git_bytes("show", "HEAD:browser.html").decode("utf-8", errors="ignore")
          d1_active = set(re.findall(r'"(idx_\d+_\d+\.js)"', idx_html))
          d2_active = set(re.findall(r'"(idx_\d+_\d+\.js)"', brw_html))
          d3_keep = {"00_works.js", "01_idx.js", "vmanifest.js", "vworks.js", "vdecks.js", "vfingerprints.js"}
          d4_catalogue = git_bytes("show", "HEAD:d4/catalogue.js").decode("utf-8")
          d4_shards = re.findall(r'"(c\d{2,}\.js)"', d4_catalogue)
          assert d4_shards and len(d4_shards) == len(set(d4_shards)), "Invalid d4 catalogue shards"

          film_ai_mf = git_bytes("show", "HEAD:film-ai/manifest.js").decode("utf-8", errors="ignore")
          m_ai = re.search(r"window\.FILM_AI_IMAGES\s*=\s*(\{.*?\})\s*;", film_ai_mf, re.S)
          film_ai_jpg_keep = {v for v in (json.loads(m_ai.group(1)).values() if m_ai else []) if isinstance(v, str) and v.lower().endswith((".jpg", ".jpeg"))}
          raw_paths = [p.decode("utf-8") for p in git_bytes("ls-tree", "-r", "-z", "--name-only", "HEAD").split(b"\x00") if p]
          # Keep the historical cards mapped to the saved images of the same scenes.
          history_pages = {
              "index.html": idx_html,
              "history-batch.html": git_bytes("show", "HEAD:history-batch.html").decode("utf-8"),
              "history-batch-1001-2000.html": git_bytes("show", "HEAD:history-batch-1001-2000.html").decode("utf-8"),
          }
          for rel, html in history_pages.items():
              assert "regenerated-manifest.js" not in html and "JINTAI_REGENERATED_IMAGES" not in html, f"Redrawn image mapping returned in {rel}"
          assert "history-ai/manifest.js" in idx_html and "function histPreview(id){return window.JINTAI_AI_IMAGES?.[id]||" in idx_html, "Homepage saved-image mapping missing"
          for rel in ("history-batch.html", "history-batch-1001-2000.html"):
              assert "function previewSrc(r){return histImgSrc(r.thumbnail);}" in history_pages[rel], f"Saved image mapping missing in {rel}"
          history_js = git_bytes("show", "HEAD:history-ai/manifest.js").decode("utf-8")
          m_history = re.search(r"window\.JINTAI_AI_IMAGES\s*=\s*(\{.*?\})\s*;", history_js, re.S)
          assert m_history, "Saved history image manifest missing"
          originals = json.loads(m_history.group(1))
          assert len(originals) == 1998, f"Saved history image count changed: {len(originals)}"
          assert all("/history-ai/thumbnails/" in url and url.endswith(".jpg") for url in originals.values()), "Saved history image paths invalid"
          print(f"Saved history image gate passed: {len(originals)} mapped images")
          selected = []
          for rel in raw_paths:
              if rel.startswith((".github/", "tools/", "每日更新/管理/")):
                  continue
              parts = rel.split("/")
              top = parts[0] if len(parts) > 1 else "(root)"
              name = parts[-1]
              if top == "每日更新" and not name.lower().endswith(".html"):
                  continue
              if top == "(root)" and name.lower().endswith((".xlsx", ".zip", ".7z", ".bak")):
                  continue
              if top in ("d1", "d2") and rel not in ("d1/compat_selected_2000_20261111.js", "d2/compat_selected_2000_20261111.js"):
                  continue
              if top == "d1_idx":
                  if name not in d1_active:
                      continue
              elif top == "d2_idx":
                  if name not in d2_active:
                      continue
              elif top == "d3":
                  if not (name in d3_keep or re.match(r"^d\d+\.js$", name)):
                      continue
              elif top == "d4":
                  if name not in ("summary.js", "catalogue.js"):
                      continue
              elif top in ("figures_data", "websearch_data", "dynasty_data", "arch_data", "myth_data", "epics_data", "zhiguai_data", "hongloumeng_data", "liaozhai_data"):
                  if name != "manifest.js":
                      continue
              elif top == "film-ai":
                  # Deck WebP files, restored archives, and unreferenced JPGs stay outside Pages.
                  if (rel.startswith("film-ai/decks/") and name.lower().endswith(".webp")) or rel.startswith("film-ai/restored/"):
                      continue
                  if name.lower().endswith((".jpg", ".jpeg")):
                      if rel not in film_ai_jpg_keep:
                          continue
                  elif not (rel in ("film-ai/manifest.js", "film-ai/shots-manifest.js") or rel.startswith("film-ai/decks/")):
                      continue
              elif top == "history-ai":
                  history_files = {
                      "manifest.js", "source-notes.js", "regenerated-manifest.js",
                      "gallery-data.js", "gallery-data-batch2.js",
                      "batch-manifest.json", "batch2-manifest.json",
                      "image-audit.json", "verification.json", "verification-batch2.json",
                  }
                  # History thumbnails are served from GitHub Raw (+ testingcf fallback), not Pages.
                  if name not in history_files:
                      continue
              selected.append(rel)

          print(f"Batch sparse-fetching {len(selected)} selected files (d1_active={len(d1_active)}, d2_active={len(d2_active)})...")
          def escape_sparse_pattern(p: str) -> str:
              return "/" + re.sub(r"([*?\[\\!#])", r"\\\1", p)

          patterns = "\n".join(escape_sparse_pattern(p) for p in selected + ["d4/" + s for s in d4_shards]) + "\n"
          subprocess.run(["git", "-C", str(repo), "sparse-checkout", "init", "--no-cone"], check=True)
          subprocess.run(
              ["git", "-C", str(repo), "sparse-checkout", "set", "--no-cone", "--stdin"],
              input=patterns.encode("utf-8"),
              check=True,
          )
          subprocess.run(["git", "-C", str(repo), "checkout", "HEAD"], check=True)

          # A malformed cache-version edit has twice truncated an inline film script.
          # Stop the deployment before a broken page replaces the last good one.
          for rel in ("film.html", "影视参考图集.html", "sources.html", "影视来源目录.html"):
              html = (repo / rel).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html)
              assert scripts, f"No inline scripts found in {rel}"
              for script in scripts:
                  if script.strip():
                      subprocess.run(["node", "--check", "-"], input=script.encode("utf-8"), check=True)
              print(f"Checked inline JavaScript in {rel}")

          total_bytes = 0
          for rel in selected:
              src = repo / rel
              dst = site / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              total_bytes += src.stat().st_size
              shutil.move(str(src), str(dst))

          for name in d4_shards:
              source = (repo / "d4" / name).read_bytes()
              packed = gzip.compress(source, compresslevel=1, mtime=0)
              assert gzip.decompress(packed) == source, f"Corrupt d4 shard: {name}"
              target = site / "d4" / (name + ".gz")
              target.write_bytes(packed)
              total_bytes += len(packed)
          print(f"Staged {len(d4_shards)} compressed d4 catalogue shards")

          shots_manifest = site / "film-ai" / "shots-manifest.js"
          if shots_manifest.exists():
              # The source HTML pin may drift when independent image batches land.
              # Pin the staged pages to the exact staged manifest before the
              # deployment-only revision marker is appended.
              source_pin = hashlib.sha256(shots_manifest.read_bytes()).hexdigest()[:16]
              shot_pin_re = re.compile(
                  r'(<script src="film-ai/shots-manifest\.js\?v=)([0-9a-f]{8,64})("></script>)'
              )
              for rel in ("film.html", "影视参考图集.html"):
                  page = site / rel
                  html = page.read_text(encoding="utf-8")
                  pinned, count = shot_pin_re.subn(
                      lambda match: match.group(1) + source_pin + match.group(3),
                      html,
                  )
                  assert count == 1, f"Expected one film shot manifest pin in {rel}"
                  if pinned != html:
                      page.write_text(pinned, encoding="utf-8", newline="\n")
              revision = git_bytes("rev-parse", "HEAD").decode("ascii").strip()
              with shots_manifest.open("a", encoding="utf-8") as handle:
                  handle.write(f"\nwindow.FILM_SHOT_ASSET_REV='{revision}';\n")
              print(f"Pinned staged film pages to shot manifest {source_pin}")

          # Filter only the Pages copy. Source mappings remain available for
          # later high-resolution replacement and the deployment still runs.
          gate = pathlib.Path("film_work_card_jpg_gate.py")
          gate.write_bytes(git_bytes("show", "HEAD:tools/filter_film_ai_manifest.py"))
          subprocess.run(
              ["python3", str(gate), "filter", "--repo", str(repo), "--site", str(site),
               "--report", str(site / "film-ai" / "work-card-jpg-gate-report.json")],
              check=True,
          )
          gate.unlink()

          # Film cards load JPGs from GitHub Raw. Validate them above, then
          # omit this duplicate media copy from the Pages artifact.
          film_jpgs = list((site / "film-ai").rglob("*.jpg"))
          film_jpg_bytes = sum(image.stat().st_size for image in film_jpgs)
          for image in film_jpgs:
              image.unlink()
          total_bytes -= film_jpg_bytes
          print(f"Serving {len(film_jpgs)} film JPGs from GitHub Raw; omitted {film_jpg_bytes / 1048576:.2f} MiB from Pages")
          max_site_bytes = 950 * 1024 * 1024
          assert total_bytes < max_site_bytes, f"_site exceeded 950 MiB safety threshold: {total_bytes / 1048576:.2f} MiB"

          # Check final staged HTML after the JPG gate has edited its own pin.
          if shots_manifest.exists():
              for rel in ("film.html", "影视参考图集.html"):
                  pins = shot_pin_re.findall((site / rel).read_text(encoding="utf-8"))
                  assert len(pins) == 1 and pins[0][1] == source_pin, rel

          (site / ".nojekyll").write_text("", encoding="utf-8")
          print(f"Staged {len(selected)} files into _site ({total_bytes / (1024*1024):.2f} MiB)")
          PY
          rm -rf repo
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
