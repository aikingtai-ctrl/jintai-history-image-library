name: Deploy GitHub Pages (Lean Shell + Active Index)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "film-ai/shots/**"
      - "film-ai/shots-manifest.js"
      - "film-ai/shots-ledger-26.jsonl"
      - "film-ai/*.jpg"
      - "film-ai/*.png"
      - "film-ai/*.webp"
      - "film-ai/restored/**"
      - "history-ai/thumbnails/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Single-pack sparse clone and stage lean _site (<450 MiB)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

          python3 - <<'PY'
          import pathlib, re, shutil, subprocess

          repo = pathlib.Path("repo")
          site = pathlib.Path("_site")
          site.mkdir(parents=True, exist_ok=True)

          def git_bytes(*args):
              return subprocess.check_output(["git", "-C", str(repo), *args])

          idx_html = git_bytes("show", "HEAD:index.html").decode("utf-8", errors="ignore")
          brw_html = git_bytes("show", "HEAD:browser.html").decode("utf-8", errors="ignore")
          d1_active = set(re.findall(r'"(idx_\d+_\d+\.js)"', idx_html))
          d2_active = set(re.findall(r'"(idx_\d+_\d+\.js)"', brw_html))
          d3_keep = {"00_works.js", "01_idx.js", "vmanifest.js", "vworks.js", "vdecks.js", "vfingerprints.js"}

          raw_paths = [p.decode("utf-8") for p in git_bytes("ls-tree", "-r", "-z", "--name-only", "HEAD").split(b"\x00") if p]
          selected = []
          for rel in raw_paths:
              if rel.startswith((".github/", "tools/", "每日更新/管理/")):
                  continue
              parts = rel.split("/")
              top = parts[0] if len(parts) > 1 else "(root)"
              name = parts[-1]
              if top == "(root)" and name.lower().endswith((".xlsx", ".zip", ".7z", ".bak")):
                  continue
              if top in ("d1", "d2") and rel not in ("d1/compat_selected_2000_20261111.js", "d2/compat_selected_2000_20261111.js"):
                  continue
              if top == "d1_idx":
                  if name not in d1_active:
                      continue
              elif top == "d2_idx":
                  if name not in d2_active:
                      continue
              elif top == "d3":
                  if not (name in d3_keep or re.match(r"^d\d+\.js$", name)):
                      continue
              elif top == "d4":
                  if name not in ("summary.js", "catalogue.js"):
                      continue
              elif top in ("figures_data", "websearch_data", "dynasty_data", "arch_data", "myth_data", "epics_data", "zhiguai_data", "hongloumeng_data", "liaozhai_data"):
                  if name != "manifest.js":
                      continue
              elif top == "film-ai":
                  if not (rel in ("film-ai/manifest.js", "film-ai/shots-manifest.js") or rel.startswith("film-ai/decks/")):
                      continue
              elif top == "history-ai":
                  if name not in ("manifest.js", "source-notes.js"):
                      continue
              selected.append(rel)

          print(f"Batch sparse-fetching {len(selected)} selected files (d1_active={len(d1_active)}, d2_active={len(d2_active)})...")
          def escape_sparse_pattern(p: str) -> str:
              return "/" + re.sub(r"([*?\[\\!#])", r"\\\1", p)

          patterns = "\n".join(escape_sparse_pattern(p) for p in selected) + "\n"
          subprocess.run(["git", "-C", str(repo), "sparse-checkout", "init", "--no-cone"], check=True)
          subprocess.run(
              ["git", "-C", str(repo), "sparse-checkout", "set", "--no-cone", "--stdin"],
              input=patterns.encode("utf-8"),
              check=True,
          )
          subprocess.run(["git", "-C", str(repo), "checkout", "HEAD"], check=True)

          total_bytes = 0
          for rel in selected:
              src = repo / rel
              dst = site / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              total_bytes += src.stat().st_size
              shutil.move(str(src), str(dst))

          max_site_bytes = 850 * 1024 * 1024
          assert total_bytes < max_site_bytes, f"_site exceeded 850 MiB safety threshold: {total_bytes / 1048576:.2f} MiB"

          shots_manifest = site / "film-ai" / "shots-manifest.js"
          if shots_manifest.exists():
              revision = git_bytes("rev-parse", "HEAD").decode("ascii").strip()
              with shots_manifest.open("a", encoding="utf-8") as handle:
                  handle.write(f"\nwindow.FILM_SHOT_ASSET_REV='{revision}';\n")

          (site / ".nojekyll").write_text("", encoding="utf-8")
          print(f"Staged {len(selected)} files into _site ({total_bytes / (1024*1024):.2f} MiB)")
          PY
          rm -rf repo
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
