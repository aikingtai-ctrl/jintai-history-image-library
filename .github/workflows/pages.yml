name: Deploy GitHub Pages (Lean Shell + Active Index)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "film-ai/shots/**"
      - "film-ai/shots-manifest.js"
      - "film-ai/shots-ledger-26.jsonl"
      - "film-ai/*.jpg"
      - "film-ai/*.png"
      - "film-ai/*.webp"
      - "film-ai/restored/**"
      - "history-ai/thumbnails/**"
      - "history-ai/gpt-image-previews/**"
      - "history-ai/regenerated-previews/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Cache verified film HD JPEG blob OIDs
        uses: actions/cache@v5
        with:
          path: .cache/verified-film-hd-jpgs.json
          key: film-hd-jpg-oids-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            film-hd-jpg-oids-

      - name: Single-pack sparse clone and stage lean _site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

          python3 - <<'PY'
          import gzip, hashlib, json, pathlib, re, shutil, subprocess

          repo = pathlib.Path("repo")
          site = pathlib.Path("_site")
          site.mkdir(parents=True, exist_ok=True)
          hd_cache_path = pathlib.Path(".cache/verified-film-hd-jpgs.json")

          def git_bytes(*args):
              return subprocess.check_output(["git", "-C", str(repo), *args])

          idx_html = git_bytes("show", "HEAD:index.html").decode("utf-8", errors="ignore")
          brw_html = git_bytes("show", "HEAD:browser.html").decode("utf-8", errors="ignore")
          d1_active = set(re.findall(r'"(idx_\d+_\d+\.js)"', idx_html))
          d2_active = set(re.findall(r'"(idx_\d+_\d+\.js)"', brw_html))
          d3_keep = {"00_works.js", "01_idx.js", "vmanifest.js", "vworks.js", "vdecks.js", "vfingerprints.js"}
          d4_catalogue = git_bytes("show", "HEAD:d4/catalogue.js").decode("utf-8")
          d4_shards = re.findall(r'"(c\d{2,}\.js)"', d4_catalogue)
          assert d4_shards and len(d4_shards) == len(set(d4_shards)), "Invalid d4 catalogue shards"

          film_ai_mf = git_bytes("show", "HEAD:film-ai/manifest.js").decode("utf-8", errors="ignore")
          m_ai = re.search(r"window\.FILM_AI_IMAGES\s*=\s*(\{.*?\})\s*;", film_ai_mf, re.S)
          film_ai_jpg_keep = {v for v in (json.loads(m_ai.group(1)).values() if m_ai else []) if isinstance(v, str) and v.lower().endswith((".jpg", ".jpeg"))}

          # Skip downloading JPEGs whose blob OID matches immutable baseline or verified HD OID cache.
          baseline_obj = json.loads(git_bytes("show", "HEAD:film-ai/work-card-image-baseline.json").decode("utf-8"))
          grandfathered_pairs = {
              (entry[0], entry[1])
              for entry in (baseline_obj.get("mappings") or {}).values()
              if isinstance(entry, list) and len(entry) == 2
          }
          film_blobs = {}
          for row in git_bytes("ls-tree", "-r", "-z", "HEAD", "--", "film-ai").split(b"\x00"):
              if not row:
                  continue
              meta, sep, bpath = row.partition(b"\t")
              if sep:
                  cols = meta.decode("ascii").split()
                  if len(cols) >= 3 and cols[1] == "blob":
                      film_blobs[bpath.decode("utf-8")] = cols[2]
          verified_hd = {}
          if hd_cache_path.is_file():
              try:
                  loaded_hd = json.loads(hd_cache_path.read_text(encoding="utf-8"))
                  if isinstance(loaded_hd, dict):
                      verified_hd = loaded_hd
              except Exception:
                  verified_hd = {}
          film_ai_jpg_need_fetch = set()
          skipped_grandfathered = 0
          skipped_cached_hd = 0
          for rel_jpg in film_ai_jpg_keep:
              oid = film_blobs.get(rel_jpg)
              if not oid:
                  continue
              if (rel_jpg, oid) in grandfathered_pairs:
                  skipped_grandfathered += 1
                  continue
              c_item = verified_hd.get(rel_jpg)
              if (
                  isinstance(c_item, list)
                  and len(c_item) == 3
                  and c_item[0] == oid
                  and isinstance(c_item[1], int)
                  and isinstance(c_item[2], int)
                  and c_item[1] >= 1280
                  and c_item[2] >= 720
              ):
                  skipped_cached_hd += 1
                  continue
              film_ai_jpg_need_fetch.add(rel_jpg)
          print(
              f"Film JPEG pre-filter: total={len(film_ai_jpg_keep)}, "
              f"skip_grandfathered={skipped_grandfathered}, "
              f"skip_cached_hd={skipped_cached_hd}, "
              f"need_fetch={len(film_ai_jpg_need_fetch)}"
          )

          raw_paths = [p.decode("utf-8") for p in git_bytes("ls-tree", "-r", "-z", "--name-only", "HEAD").split(b"\x00") if p]
          raw_paths_set = set(raw_paths)
          # Keep saved JPEG evidence and expose only accepted GPT Image PNGs.
          history_pages = {
              "index.html": idx_html,
              "history-batch.html": git_bytes("show", "HEAD:history-batch.html").decode("utf-8"),
              "history-batch-1001-2000.html": git_bytes("show", "HEAD:history-batch-1001-2000.html").decode("utf-8"),
          }
          for rel, html in history_pages.items():
              assert "gpt-image-manifest.js" in html, f"GPT Image manifest missing in {rel}"
              assert "original-pngs/" in html and "download=1" in html, f"GPT Image original download missing in {rel}"
              assert "regenerated-manifest.js" not in html and "JINTAI_REGENERATED_IMAGES" not in html, f"Old Qwen redrawn image mapping returned in {rel}"
          assert "history-ai/manifest.js" in idx_html and "function histPreview(id){return window.JINTAI_PAGE20_IMAGES?.[id]?.preview||window.JINTAI_PAGE19_IMAGES?.[id]?.preview||window.JINTAI_QING_IMAGES?.[id]?.preview||window.JINTAI_GPT_IMAGES?.[id]?.preview||" in idx_html and re.search(r"function histPreview\(id\)\{[^\n]*window\.JINTAI_AI_IMAGES\?\.\[id\]", idx_html), "Accepted GPT Image preview priority missing"
          assert "function histThumb(id){return window.JINTAI_PAGE20_IMAGES?.[id]?.preview||window.JINTAI_PAGE19_IMAGES?.[id]?.preview||window.JINTAI_QING_IMAGES?.[id]?.preview||window.JINTAI_GPT_IMAGES?.[id]?.preview||" in idx_html and re.search(r"function histThumb\(id\)\{[^\n]*histPreview\(id\);", idx_html), "Accepted GPT Image thumbnail priority missing"
          assert "const gpt=window.JINTAI_PAGE20_IMAGES?.[r.id]||window.JINTAI_PAGE19_IMAGES?.[r.id]||window.JINTAI_QING_IMAGES?.[r.id]||window.JINTAI_GPT_IMAGES?.[r.id];" in idx_html and "saved.hidden=!(gpt&&window.JINTAI_AI_IMAGES?.[r.id])" in idx_html, "GPT Image download or saved JPEG fallback missing"
          for rel in ("history-batch.html", "history-batch-1001-2000.html"):
              assert "function gpt(r){return window.JINTAI_GPT_IMAGES?.[r.id];}" in history_pages[rel], f"Accepted GPT Image priority missing in {rel}"
              assert "function previewSrc(r){return gpt(r)?.preview||histImgSrc(r.thumbnail);}" in history_pages[rel], f"Batch preview missing in {rel}"
              assert "q('savedJpg').hidden=!(info&&oldJpg)" in history_pages[rel], f"Saved JPEG fallback missing in {rel}"
          history_js = git_bytes("show", "HEAD:history-ai/manifest.js").decode("utf-8")
          m_history = re.search(r"window\.JINTAI_AI_IMAGES\s*=\s*(\{.*?\})\s*;", history_js, re.S)
          assert m_history, "Saved history image manifest missing"
          originals = json.loads(m_history.group(1))
          assert len(originals) == 1998, f"Saved history image count changed: {len(originals)}"
          assert all("/history-ai/thumbnails/" in url and url.endswith(".jpg") for url in originals.values()), "Saved history image paths invalid"
          gpt_js = git_bytes("show", "HEAD:history-ai/gpt-image-manifest.js").decode("utf-8")
          assert gpt_js.startswith("window.JINTAI_GPT_IMAGES="), "GPT Image manifest invalid"
          gpt_images = json.loads(gpt_js.split("=", 1)[1].rstrip(";\n"))
          assert 2 <= len(gpt_images) <= 2000, f"GPT Image count invalid: {len(gpt_images)}"
          assert {"HL-SHANG-FA-0008", "HL-ZHOU-CO-0023"} <= gpt_images.keys(), "GPT Image missing resolved entries"
          assert all(item["model"] == "GPT Image" and item["original_dir"] == "history_2000_gpt_image" for item in gpt_images.values()), "GPT Image source mismatch"
          expected_previews = {"history-ai/gpt-image-previews/" + item["preview"].rsplit("/", 1)[-1] for item in gpt_images.values()}
          assert expected_previews <= raw_paths_set, "GPT Image previews missing from repository"
          qing_js = git_bytes("show", "HEAD:history-ai/qing-manifest.js").decode("utf-8")
          assert qing_js.startswith("window.JINTAI_QING_IMAGES="), "Qing GPT Image manifest invalid"
          qing_images = json.loads(qing_js.split("=", 1)[1].rstrip(";\n"))
          assert len(qing_images) <= 4573, f"Qing GPT Image count invalid: {len(qing_images)}"
          assert all(item["source"] == "Codex GPT Image original PNG" and item["original_dir"] == "history_qing_4573_codex_gpt_image_20261124" for item in qing_images.values()), "Qing GPT Image source mismatch"
          print(f"Saved JPEG gate passed: {len(originals)}; GPT Image gate passed: {len(gpt_images)}")
          selected = []
          for rel in raw_paths:
              if rel.startswith((".github/", "tools/", "tests/", "每日更新/管理/")):
                  continue
              parts = rel.split("/")
              top = parts[0] if len(parts) > 1 else "(root)"
              name = parts[-1]
              if top == "每日更新":
                  low_name = name.lower()
                  if not (
                      low_name.endswith(".html")
                      or (rel.startswith("每日更新/runs/") and low_name.endswith(".json"))
                      or (rel.startswith("每日更新/每日成果/2026101") and low_name.endswith((".md", ".txt", ".json")))
                  ):
                      continue
              if top == "(root)" and name.lower().endswith((".xlsx", ".zip", ".7z", ".bak")):
                  continue
              if top in ("d1", "d2") and rel not in ("d1/compat_selected_2000_20261111.js", "d2/compat_selected_2000_20261111.js"):
                  continue
              if top == "d1_idx":
                  if name not in d1_active:
                      continue
              elif top == "d2_idx":
                  if name not in d2_active:
                      continue
              elif top == "d3":
                  if not (name in d3_keep or re.match(r"^d\d+\.js$", name)):
                      continue
              elif top == "d4":
                  if name not in ("summary.js", "catalogue.js"):
                      continue
              elif top in ("figures_data", "websearch_data", "dynasty_data", "arch_data", "myth_data", "epics_data", "zhiguai_data", "hongloumeng_data", "liaozhai_data"):
                  if name != "manifest.js":
                      continue
              elif top == "film-ai":
                  # Deck WebP files, restored archives, and unreferenced/already-verified JPGs stay outside Pages.
                  if (rel.startswith("film-ai/decks/") and name.lower().endswith(".webp")) or rel.startswith("film-ai/restored/"):
                      continue
                  if name.lower().endswith((".jpg", ".jpeg")):
                      if rel not in film_ai_jpg_need_fetch:
                          continue
                  elif not (rel in ("film-ai/manifest.js", "film-ai/shots-manifest.js") or rel.startswith("film-ai/decks/")):
                      continue
              elif top == "history-ai":
                  history_files = {
                      "manifest.js", "source-notes.js", "gpt-image-manifest.js", "qing-manifest.js", "page19-originals-manifest.js", "page20-originals-manifest.js", "regenerated-manifest.js",
                      "gallery-data.js", "gallery-data-batch2.js",
                      "batch-manifest.json", "batch2-manifest.json",
                      "image-audit.json", "verification.json", "verification-batch2.json",
                  }
                  # History thumbnails are served from GitHub Raw (+ testingcf fallback), not Pages.
                  if name not in history_files:
                      continue
              selected.append(rel)

          d4_fetch = [
              f"d4/{s}.gz" if f"d4/{s}.gz" in raw_paths_set else f"d4/{s}"
              for s in d4_shards
          ]
          print(f"Batch sparse-fetching {len(selected)} selected files + {len(d4_fetch)} d4 shards (d1_active={len(d1_active)}, d2_active={len(d2_active)})...")
          def escape_sparse_pattern(p: str) -> str:
              return "/" + re.sub(r"([*?\[\\!#])", r"\\\1", p)

          patterns = "\n".join(escape_sparse_pattern(p) for p in selected + d4_fetch) + "\n"
          subprocess.run(["git", "-C", str(repo), "sparse-checkout", "init", "--no-cone"], check=True)
          subprocess.run(
              ["git", "-C", str(repo), "sparse-checkout", "set", "--no-cone", "--stdin"],
              input=patterns.encode("utf-8"),
              check=True,
          )
          subprocess.run(["git", "-C", str(repo), "checkout", "HEAD"], check=True)

          # Stop deployment if any inline script in core film pages has syntax errors.
          for rel in ("film.html", "影视参考图集.html", "sources.html", "影视来源目录.html"):
              html = (repo / rel).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html)
              assert scripts, f"No inline scripts found in {rel}"
              for script in scripts:
                  if script.strip():
                      subprocess.run(["node", "--check", "-"], input=script.encode("utf-8"), check=True)
              print(f"Checked inline JavaScript in {rel}")

          total_bytes = 0
          for rel in selected:
              src = repo / rel
              dst = site / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              total_bytes += src.stat().st_size
              shutil.move(str(src), str(dst))

          # Upgrade staged _site/index.html & _site/browser.html to 2-stage progressive wave loading
          # (boot chunk first -> ~1s interactive first screen, then polite waves of 3) without touching repo layout_sha256.
          idx_stage = site / "index.html"
          if idx_stage.is_file():
              ih = idx_stage.read_text(encoding="utf-8")
              if "__JT_FIRST_SCREEN_READY__" not in ih:
                  idx_re = re.compile(r"^async function loadAll\(\)\{\$\('loadmsg'\)\.textContent=[^\n]+\}$", re.M)
                  new_idx_fn = (
                      "async function loadAll(){$('loadmsg').textContent='正在载入全库索引（0/'+IDX_CHUNKS.length+'）…';"
                      "let doneIdx=0;const loadIdx=async fn=>{await loadScriptChain(buildUrls('d1_idx/'+fn,'d1_idx/'+fn,'d1_idx/'+fn),10000);"
                      "doneIdx++;$('loadmsg').textContent=`正在载入全库索引（${doneIdx}/${IDX_CHUNKS.length}）…`;};"
                      "if(IDX_CHUNKS.length>0){const bootSet=new Set([IDX_CHUNKS[0]]);"
                      "if(typeof f==='object'&&f&&f.sort==='newest'&&IDX_CHUNKS.length>1)bootSet.add(IDX_CHUNKS[IDX_CHUNKS.length-1]);"
                      "await Promise.all([...bootSet].map(loadIdx));rebuildStoryDropdown();renderSubcats();apply();"
                      "window.__JT_FIRST_SCREEN_READY__=true;await new Promise(r=>setTimeout(r,24));"
                      "const rest=IDX_CHUNKS.filter(fn=>!bootSet.has(fn));"
                      "for(let w=0;w<rest.length;w+=3){await Promise.all(rest.slice(w,w+3).map(loadIdx));"
                      "if(typeof f==='object'&&f&&(f.era||f.kind||f.subdyn||f.subcat||f.spec||f.q))apply();"
                      "await new Promise(r=>setTimeout(r,16));}"
                      "if(rest.length>0){rebuildStoryDropdown();renderSubcats();apply();}}"
                      "const extra=SHARDS.filter(s=>!loaded.has(s.file));"
                      "if(extra.length>0){await Promise.all(extra.map(async s=>{await loadShard(s);loadmsg();}));"
                      "rebuildStoryDropdown();renderSubcats();apply();}$('loadmsg').textContent='';}"
                  )
                  ih2, c_idx = idx_re.subn(lambda _: new_idx_fn, ih, count=1)
                  assert c_idx == 1, f"Expected 1 loadAll() match in index.html, got {c_idx}"
                  old_sz = idx_stage.stat().st_size
                  idx_stage.write_text(ih2, encoding="utf-8", newline="\n")
                  total_bytes += idx_stage.stat().st_size - old_sz

          brw_stage = site / "browser.html"
          if brw_stage.is_file():
              bh = brw_stage.read_text(encoding="utf-8")
              if "__JT_FIRST_SCREEN_READY__" not in bh:
                  brw_re = re.compile(r"^async function loadAll\(\)\{[^\n]*IDX_CHUNKS[^\n]+\}$", re.M)
                  new_brw_fn = (
                      "async function loadAll(){const loadIdx=fn=>loadScriptChain(buildUrls('d2_idx/'+fn,'d2_idx/'+fn,'d2_idx/'+fn),10000);"
                      "if(IDX_CHUNKS.length>0){await loadIdx(IDX_CHUNKS[0]);rebuildCats();apply();"
                      "window.__JT_FIRST_SCREEN_READY__=true;await new Promise(r=>setTimeout(r,24));"
                      "const rest=IDX_CHUNKS.slice(1);"
                      "for(let w=0;w<rest.length;w+=3){await Promise.all(rest.slice(w,w+3).map(loadIdx));"
                      "if(typeof state==='object'&&state&&(state.group||state.kind||state.cat||state.q))apply();"
                      "await new Promise(r=>setTimeout(r,16));}"
                      "if(rest.length>0){rebuildCats();apply();}}"
                      "const extra=SHARDS.filter(s=>!loaded.has(s.file));"
                      "if(extra.length>0){await Promise.all(extra.map(s=>loadShard(s)));rebuildCats();apply();}}"
                  )
                  bh2, c_brw = brw_re.subn(lambda _: new_brw_fn, bh, count=1)
                  assert c_brw == 1, f"Expected 1 loadAll() match in browser.html, got {c_brw}"
                  old_sz = brw_stage.stat().st_size
                  brw_stage.write_text(bh2, encoding="utf-8", newline="\n")
                  total_bytes += brw_stage.stat().st_size - old_sz

          # Upgrade staged specialty galleries to 2-stage progressive wave loading (boot shard first -> ~1.5s first card, then waves of 3).
          v4_hyd_re = re.compile(r"async function hydrateSpecialistData\(\)\{[\s\S]*?\}\n(?=/\*__SPECIALIST_V4_SHARD_END__\*/)")
          v4_new_fn = (
              "async function hydrateSpecialistData(){\n"
              "  if(document.getElementById('jt_gate_css')&&document.documentElement.getAttribute('data-jt-ok')!=='1')return;\n"
              "  const cntEl=document.getElementById('count');\n"
              "  if(cntEl)cntEl.textContent='正在载入考证专集首屏数据…';\n"
              "  window.SPECIALIST_V4_MANIFEST=null;\n"
              "  await loadSpecResource('manifest.js?v='+Date.now(),true,()=>{if(!window.SPECIALIST_V4_MANIFEST)throw new Error('mf');});\n"
              "  const mf=window.SPECIALIST_V4_MANIFEST,shards=(mf&&Array.isArray(mf.shards))?mf.shards:[],ver=mf&&mf.version?('?v='+mf.version):'';\n"
              "  DATA.length=0;\n"
              "  if(!shards.length){initCounts();apply();window.__JT_SPEC_FIRST_READY__=true;window.__JT_SPEC_ALL_READY__=true;return;}\n"
              "  await loadSpecResource(shards[0]+ver,false,()=>{if(!window.__SPEC_V4_CHUNKS__[0])throw new Error('chunk');});\n"
              "  {const rows=_unpackWS(window.__SPEC_V4_CHUNKS__[0]);for(let j=0;j<rows.length;j++)DATA.push(rows[j]);delete window.__SPEC_V4_CHUNKS__[0];}\n"
              "  initCounts();\n"
              "  apply();\n"
              "  window.__JT_SPEC_FIRST_READY__=true;\n"
              "  if(shards.length>1){\n"
              "    await new Promise(r=>setTimeout(r,24));\n"
              "    for(let w=1;w<shards.length;w+=3){\n"
              "      const end=Math.min(shards.length,w+3),idxs=[];\n"
              "      for(let i=w;i<end;i++)idxs.push(i);\n"
              "      await Promise.all(idxs.map(i=>loadSpecResource(shards[i]+ver,false,()=>{if(!window.__SPEC_V4_CHUNKS__[i])throw new Error('chunk');})));\n"
              "      for(const i of idxs){const rows=_unpackWS(window.__SPEC_V4_CHUNKS__[i]);for(let j=0;j<rows.length;j++){const r=rows[j];if(typeof computeChronoRank==='function')r._cRank=computeChronoRank(r);DATA.push(r);}delete window.__SPEC_V4_CHUNKS__[i];}\n"
              "      await new Promise(r=>setTimeout(r,16));\n"
              "    }\n"
              "    const prevScroll=window.scrollY,prevPage=page;\n"
              "    initCounts();\n"
              "    apply();\n"
              "    if(prevPage>0){page=prevPage;render();}\n"
              "    window.scrollTo(0,prevScroll);\n"
              "  }\n"
              "  window.__JT_SPEC_ALL_READY__=true;\n"
              "}\n"
          )
          for v4_rel in ("websearch5000.html", "dynasty2000.html"):
              vp = site / v4_rel
              if vp.is_file():
                  vh = vp.read_text(encoding="utf-8")
                  if "__JT_SPEC_FIRST_READY__" not in vh and "/*__SPECIALIST_V4_SHARD_END__*/" in vh:
                      vh2, vc = v4_hyd_re.subn(lambda _: v4_new_fn, vh, count=1)
                      assert vc == 1, f"Expected 1 hydrateSpecialistData() match in {v4_rel}, got {vc}"
                      old_sz = vp.stat().st_size
                      vp.write_text(vh2, encoding="utf-8", newline="\n")
                      total_bytes += vp.stat().st_size - old_sz

          spec_all_hyd_re = re.compile(r"async function hydrateSpecialistPage\(\)\{[\s\S]*?\}\n(?=/\*__SPEC_ALL_SHARD_END__\*/)")
          spec_all_bodies = {
              "flat_data": (
                  "  DATA.length=0;\n"
                  "  if(!shards.length){list=DATA;initFilters();apply();window.__JT_SPEC_FIRST_READY__=true;window.__JT_SPEC_ALL_READY__=true;return;}\n"
                  "  await loadSpecAllRes(shards[0]+ver,false,()=>{if(!window.__SPEC_ALL_CHUNKS__[shards[0]])throw new Error('chunk');});\n"
                  "  {const rows=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[shards[0]]);for(let j=0;j<rows.length;j++)DATA.push(rows[j]);delete window.__SPEC_ALL_CHUNKS__[shards[0]];}\n"
                  "  list=DATA;initFilters();apply();window.__JT_SPEC_FIRST_READY__=true;\n"
                  "  if(shards.length>1){\n"
                  "    await new Promise(r=>setTimeout(r,24));\n"
                  "    for(let w=1;w<shards.length;w+=3){\n"
                  "      const batch=shards.slice(w,w+3);\n"
                  "      await Promise.all(batch.map(sh=>loadSpecAllRes(sh+ver,false,()=>{if(!window.__SPEC_ALL_CHUNKS__[sh])throw new Error('chunk');})));\n"
                  "      for(const sh of batch){const rows=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[sh]);for(let j=0;j<rows.length;j++)DATA.push(rows[j]);delete window.__SPEC_ALL_CHUNKS__[sh];}\n"
                  "      await new Promise(r=>setTimeout(r,16));\n"
                  "    }\n"
                  "    const prevScroll=window.scrollY,prevPage=page;\n"
                  "    list=DATA;initFilters();\n"
                  "    if(typeof fSub==='string'&&document.getElementById('subRow'))document.querySelectorAll('#subRow .chip').forEach(x=>x.classList.toggle('on',x.dataset.sub===fSub));\n"
                  "    if(typeof fState==='string'&&document.getElementById('stateRow'))document.querySelectorAll('#stateRow .chip').forEach(x=>x.classList.toggle('on',x.dataset.state===fState));\n"
                  "    apply();\n"
                  "    if(prevPage>0){page=prevPage;render();}\n"
                  "    window.scrollTo(0,prevScroll);\n"
                  "  }\n"
                  "  window.__JT_SPEC_ALL_READY__=true;\n"
              ),
              "epics_raw": (
                  "  const boot=(mf&&mf.meta_shard)?(shards.length?[mf.meta_shard,shards[0]]:[mf.meta_shard]):(shards.length?[shards[0]]:[]);\n"
                  "  await Promise.all(boot.map(sh=>loadSpecAllRes(sh+ver,false,()=>{if(!window.__SPEC_ALL_CHUNKS__[sh])throw new Error('chunk');})));\n"
                  "  const meta=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[mf.meta_shard]);delete window.__SPEC_ALL_CHUNKS__[mf.meta_shard];\n"
                  "  RAW.groups=meta.groups||[];RAW.existing=meta.existing||[];RAW.items=[];\n"
                  "  GROUPS.length=0;for(let i=0;i<RAW.groups.length;i++)GROUPS.push(_mapEpGroup(RAW.groups[i]));\n"
                  "  ITEMS.length=0;\n"
                  "  if(shards.length){const rows=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[shards[0]]);for(let j=0;j<rows.length;j++){const r=rows[j];RAW.items.push(r);ITEMS.push(_mapEpItem(r));}delete window.__SPEC_ALL_CHUNKS__[shards[0]];}\n"
                  "  filtered=ITEMS;initChips();renderWorks();applyPrompts();renderExisting();window.__JT_SPEC_FIRST_READY__=true;\n"
                  "  if(shards.length>1){\n"
                  "    await new Promise(r=>setTimeout(r,24));\n"
                  "    for(let w=1;w<shards.length;w+=3){\n"
                  "      const batch=shards.slice(w,w+3);\n"
                  "      await Promise.all(batch.map(sh=>loadSpecAllRes(sh+ver,false,()=>{if(!window.__SPEC_ALL_CHUNKS__[sh])throw new Error('chunk');})));\n"
                  "      for(const sh of batch){const rows=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[sh]);for(let j=0;j<rows.length;j++){const r=rows[j];RAW.items.push(r);ITEMS.push(_mapEpItem(r));}delete window.__SPEC_ALL_CHUNKS__[sh];}\n"
                  "      await new Promise(r=>setTimeout(r,16));\n"
                  "    }\n"
                  "    initChips();applyPrompts();\n"
                  "  }\n"
                  "  window.__JT_SPEC_ALL_READY__=true;\n"
              ),
              "zhiguai_raw": (
                  "  const boot=(mf&&mf.meta_shard)?(shards.length?[mf.meta_shard,shards[0]]:[mf.meta_shard]):(shards.length?[shards[0]]:[]);\n"
                  "  await Promise.all(boot.map(sh=>loadSpecAllRes(sh+ver,false,()=>{if(!window.__SPEC_ALL_CHUNKS__[sh])throw new Error('chunk');})));\n"
                  "  const meta=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[mf.meta_shard]);delete window.__SPEC_ALL_CHUNKS__[mf.meta_shard];\n"
                  "  RAW.books=meta.books||[];RAW.groups=meta.groups||[];RAW.existing=meta.existing||[];RAW.total_existing=meta.total_existing||0;RAW.items=[];ITEMS.length=0;\n"
                  "  if(shards.length){const rows=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[shards[0]]);for(let j=0;j<rows.length;j++){const r=rows[j];RAW.items.push(r);ITEMS.push(_mapZgItem(r));}delete window.__SPEC_ALL_CHUNKS__[shards[0]];}\n"
                  "  filtered=ITEMS;initChips();renderBooks();applyPrompts();renderExisting();\n"
                  "  if(typeof zgRenderHomeGallery==='function')zgRenderHomeGallery();\n"
                  "  window.__JT_SPEC_FIRST_READY__=true;\n"
                  "  if(shards.length>1){\n"
                  "    await new Promise(r=>setTimeout(r,24));\n"
                  "    for(let w=1;w<shards.length;w+=3){\n"
                  "      const batch=shards.slice(w,w+3);\n"
                  "      await Promise.all(batch.map(sh=>loadSpecAllRes(sh+ver,false,()=>{if(!window.__SPEC_ALL_CHUNKS__[sh])throw new Error('chunk');})));\n"
                  "      for(const sh of batch){const rows=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[sh]);for(let j=0;j<rows.length;j++){const r=rows[j];RAW.items.push(r);ITEMS.push(_mapZgItem(r));}delete window.__SPEC_ALL_CHUNKS__[sh];}\n"
                  "      await new Promise(r=>setTimeout(r,16));\n"
                  "    }\n"
                  "    initChips();\n"
                  "    if(typeof curBookNo==='number'&&document.getElementById('bookChips'))document.querySelectorAll('#bookChips .chip').forEach(c=>c.classList.toggle('on',parseInt(c.dataset.bno,10)===curBookNo));\n"
                  "    applyPrompts();\n"
                  "    if(typeof zgRenderHomeGallery==='function')zgRenderHomeGallery();\n"
                  "  }\n"
                  "  window.__JT_SPEC_ALL_READY__=true;\n"
              ),
              "hlm_lz_json": (
                  "  const boot=(mf&&mf.meta_shard)?(shards.length?[mf.meta_shard,shards[0]]:[mf.meta_shard]):(shards.length?[shards[0]]:[]);\n"
                  "  await Promise.all(boot.map(sh=>loadSpecAllRes(sh+ver,false,()=>{if(!window.__SPEC_ALL_CHUNKS__[sh])throw new Error('chunk');})));\n"
                  "  const meta=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[mf.meta_shard]);delete window.__SPEC_ALL_CHUNKS__[mf.meta_shard];\n"
                  "  GROUPS.length=0;const mg=meta.groups||[];for(let i=0;i<mg.length;i++)GROUPS.push(mg[i]);\n"
                  "  LEGACY.length=0;const ml=meta.legacy||[];for(let i=0;i<ml.length;i++)LEGACY.push(ml[i]);\n"
                  "  ITEMS.length=0;\n"
                  "  if(shards.length){const rows=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[shards[0]]);for(let j=0;j<rows.length;j++)ITEMS.push(rows[j]);delete window.__SPEC_ALL_CHUNKS__[shards[0]];}\n"
                  "  fGroups=GROUPS;fItems=ITEMS;\n"
                  "  if(curTab==='grp')renderG();else if(curTab==='prm')renderP();else renderL();\n"
                  "  window.__JT_SPEC_FIRST_READY__=true;\n"
                  "  if(shards.length>1){\n"
                  "    await new Promise(r=>setTimeout(r,24));\n"
                  "    for(let w=1;w<shards.length;w+=3){\n"
                  "      const batch=shards.slice(w,w+3);\n"
                  "      await Promise.all(batch.map(sh=>loadSpecAllRes(sh+ver,false,()=>{if(!window.__SPEC_ALL_CHUNKS__[sh])throw new Error('chunk');})));\n"
                  "      for(const sh of batch){const rows=_inflateSpecAll(window.__SPEC_ALL_CHUNKS__[sh]);for(let j=0;j<rows.length;j++)ITEMS.push(rows[j]);delete window.__SPEC_ALL_CHUNKS__[sh];}\n"
                  "      await new Promise(r=>setTimeout(r,16));\n"
                  "    }\n"
                  "    if(curTab==='prm'){const _pp=pP;filterP();if(_pp>1){pP=_pp;renderP();}}else if(fItems===ITEMS)fItems=ITEMS;\n"
                  "  }\n"
                  "  window.__JT_SPEC_ALL_READY__=true;\n"
              ),
          }
          spec_all_targets = [
              ("arch5680.html", "flat_data", "count"),
              ("myth5000.html", "flat_data", "count"),
              ("epics.html", "epics_raw", "pCount"),
              ("zhiguai31.html", "zhiguai_raw", "pCount"),
              ("hongloumeng.html", "hlm_lz_json", "infoG"),
              ("liaozhai.html", "hlm_lz_json", "infoG"),
              ("聊斋志异角色场景法器全谱专集.html", "hlm_lz_json", "infoG"),
              ("聊斋志异角色与全场景专集.html", "hlm_lz_json", "infoG"),
          ]
          upgraded_spec_pages = ["index.html", "browser.html"]
          for s_rel, s_kind, s_st in spec_all_targets:
              sp = site / s_rel
              if sp.is_file():
                  sh_txt = sp.read_text(encoding="utf-8")
                  if "__JT_SPEC_FIRST_READY__" not in sh_txt and "/*__SPEC_ALL_SHARD_END__*/" in sh_txt:
                      s_new_fn = (
                          "async function hydrateSpecialistPage(){\n"
                          "  if(document.getElementById('jt_gate_css')&&document.documentElement.getAttribute('data-jt-ok')!=='1')return;\n"
                          f"  const stEl=document.getElementById('{s_st}');\n"
                          "  if(stEl)stEl.textContent='正在载入考证专集首屏数据…';\n"
                          "  window.SPEC_ALL_MANIFEST=null;\n"
                          "  await loadSpecAllRes('manifest.js?v='+Date.now(),true,()=>{if(!window.SPEC_ALL_MANIFEST)throw new Error('mf');});\n"
                          "  const mf=window.SPEC_ALL_MANIFEST,shards=(mf&&Array.isArray(mf.item_shards))?mf.item_shards:[],ver=mf&&mf.version?('?v='+mf.version):'';\n"
                          + spec_all_bodies[s_kind]
                          + "}\n"
                      )
                      sh_txt2, sc_cnt = spec_all_hyd_re.subn(lambda _: s_new_fn, sh_txt, count=1)
                      assert sc_cnt == 1, f"Expected 1 hydrateSpecialistPage() match in {s_rel}, got {sc_cnt}"
                      old_sz = sp.stat().st_size
                      sp.write_text(sh_txt2, encoding="utf-8", newline="\n")
                      total_bytes += sp.stat().st_size - old_sz
                  upgraded_spec_pages.append(s_rel)
          for v4_rel in ("websearch5000.html", "dynasty2000.html"):
              if (site / v4_rel).is_file():
                  upgraded_spec_pages.append(v4_rel)

          for rel in upgraded_spec_pages:
              st_html = (site / rel).read_text(encoding="utf-8")
              st_blocks = re.findall(r"<script([^>]*)>([\s\S]*?)</script>", st_html, re.I)
              js_checked = 0
              for st_attrs, sc in st_blocks:
                  if re.search(r"\bsrc\s*=", st_attrs, re.I) or not sc.strip():
                      continue
                  m_t = re.search(r'\btype\s*=\s*["\']?([^"\'\s>]+)', st_attrs, re.I)
                  t_v = m_t.group(1).lower() if m_t else ""
                  if t_v and t_v not in ("text/javascript", "application/javascript", "module"):
                      if "json" in t_v:
                          json.loads(sc)
                      continue
                  subprocess.run(["node", "--check", "-"], input=sc.encode("utf-8"), check=True)
                  js_checked += 1
              assert js_checked >= 1, f"No inline JS scripts in staged {rel}"
              print(f"Verified progressive loader JS syntax in staged {rel}")

          reused_gz = 0
          for name in d4_shards:
              gz_src = repo / "d4" / (name + ".gz")
              target = site / "d4" / (name + ".gz")
              target.parent.mkdir(parents=True, exist_ok=True)
              if gz_src.is_file():
                  with gzip.open(gz_src, "rb") as gf:
                      while gf.read(1 << 20):
                          pass
                  total_bytes += gz_src.stat().st_size
                  shutil.move(str(gz_src), str(target))
                  reused_gz += 1
              else:
                  source = (repo / "d4" / name).read_bytes()
                  packed = gzip.compress(source, compresslevel=1, mtime=0)
                  assert gzip.decompress(packed) == source, f"Corrupt d4 shard: {name}"
                  target.write_bytes(packed)
                  total_bytes += len(packed)
          print(f"Staged {len(d4_shards)} compressed d4 catalogue shards (reused_precompressed={reused_gz})")

          # Prioritize same-origin compressed d4 shards & GitHub Raw before jsDelivr (>50MB repo 403) in staged sources pages, plus yield after shard-0 for instant first paint.
          src_fb_re = re.compile(
              r"const fetchFallback=async\(\)=>\{\s*"
              r"if\(location\.protocol==='file:'\)\{reject\(new Error\(errMsg\)\);return;\}\s*"
              r"[\s\S]*?"
              r"reject\(new Error\(errMsg\)\);\s*\};"
          )
          src_fb_new = (
              "const fetchFallback=async()=>{\n"
              "  if(location.protocol==='file:'){reject(new Error(errMsg));return;}\n"
              "  if(isCatShard&&await loadCompressed('d4/'+clean+'.gz'+suffix,18000))return;\n"
              "  if(isCatShard&&await loadCompressed(RAW_D4_BASE+clean+'.gz'+suffix,22000))return;\n"
              "  if(await loadPlain(RAW_D4_BASE,25000))return;\n"
              "  if(isCatShard&&await loadCompressed(PACKED_D4_CDN+clean+'.gz'+suffix,15000))return;\n"
              "  if(await loadPlain(FALLBACK_D4_CDN,18000))return;\n"
              "  reject(new Error(errMsg));\n"
              " };"
          )
          src_wave_re = re.compile(
              r"if\(mf\.shards\.length>1&&typeof onFirstShard==='function'\)\{[\s\S]*?"
              r"for\(let w=1;w<mf\.shards\.length;w\+=\d+\)\{[\s\S]*?\}\s*"
              r"(?=const merged=\[\];)"
          )
          src_wave_new = (
              "if(mf.shards.length>1&&typeof onFirstShard==='function'){\n"
              "  WORKS=window.__FILM_CAT_CHUNKS__[0].slice();window.FILM_SOURCE_WORKS=WORKS;didFirst=true;onFirstShard();\n"
              "  await new Promise(r=>setTimeout(r,24));\n"
              " }\n"
              " for(let w=1;w<mf.shards.length;w+=6){\n"
              "  const slice=mf.shards.slice(w,w+6);\n"
              "  await Promise.all(slice.map((sh,off)=>{const idx=w+off;return loadD4Script(sh+ver,()=>{if(!Array.isArray(window.__FILM_CAT_CHUNKS__[idx]))throw new Error('shard');doneCnt++;return true;},'shard-'+idx);}));\n"
              "  await new Promise(r=>setTimeout(r,12));\n"
              " }\n "
          )
          for src_rel in ("sources.html", "影视来源目录.html"):
              sp_src = site / src_rel
              if sp_src.is_file():
                  sh_s = sp_src.read_text(encoding="utf-8")
                  old_sz = sp_src.stat().st_size
                  sh_s2, c_fb = src_fb_re.subn(lambda _: src_fb_new, sh_s, count=1)
                  assert c_fb == 1, f"Expected 1 fetchFallback block in {src_rel}, got {c_fb}"
                  sh_s3, c_wv = src_wave_re.subn(lambda _: src_wave_new, sh_s2, count=1)
                  assert c_wv == 1, f"Expected 1 ensureCatalogueLoaded wave block in {src_rel}, got {c_wv}"
                  sp_src.write_text(sh_s3, encoding="utf-8", newline="\n")
                  total_bytes += sp_src.stat().st_size - old_sz
                  for st_attrs, sc in re.findall(r"<script([^>]*)>([\s\S]*?)</script>", sh_s3, re.I):
                      if not re.search(r"\bsrc\s*=", st_attrs, re.I) and sc.strip():
                          subprocess.run(["node", "--check", "-"], input=sc.encode("utf-8"), check=True)
          print("Upgraded staged sources.html & 影视来源目录.html to same-origin .gz + 0-403 polite wave loader")

          shots_manifest = site / "film-ai" / "shots-manifest.js"
          if shots_manifest.exists():
              source_pin = hashlib.sha256(shots_manifest.read_bytes()).hexdigest()[:16]
              shot_pin_re = re.compile(
                  r'(<script src="film-ai/shots-manifest\.js\?v=)([0-9a-f]{8,64})("></script>)'
              )
              for rel in ("film.html", "影视参考图集.html"):
                  page = site / rel
                  html = page.read_text(encoding="utf-8")
                  pinned, count = shot_pin_re.subn(
                      lambda match: match.group(1) + source_pin + match.group(3),
                      html,
                  )
                  assert count == 1, f"Expected one film shot manifest pin in {rel}"
                  if pinned != html:
                      page.write_text(pinned, encoding="utf-8", newline="\n")
              revision = git_bytes("rev-parse", "HEAD").decode("ascii").strip()
              with shots_manifest.open("a", encoding="utf-8") as handle:
                  handle.write(f"\nwindow.FILM_SHOT_ASSET_REV='{revision}';\n")
              print(f"Pinned staged film pages to shot manifest {source_pin}")

          # Filter only the Pages copy using immutable baseline + verified HD OID cache.
          gate = pathlib.Path("film_work_card_jpg_gate.py")
          gate.write_bytes(git_bytes("show", "HEAD:tools/filter_film_ai_manifest.py"))
          subprocess.run(
              [
                  "python3", str(gate), "filter",
                  "--repo", str(repo),
                  "--site", str(site),
                  "--report", str(site / "film-ai" / "work-card-jpg-gate-report.json"),
                  "--verified-hd-cache", str(hd_cache_path),
              ],
              check=True,
          )
          gate.unlink()

          # Content-pin staged film-ai/manifest.js after HD filtering and skip redundant no-store double-fetch on boot.
          ai_manifest = site / "film-ai" / "manifest.js"
          if ai_manifest.is_file():
              ai_pin = hashlib.sha256(ai_manifest.read_bytes()).hexdigest()[:16]
              with ai_manifest.open("a", encoding="utf-8", newline="\n") as ah:
                  ah.write("\nwindow.__FILM_AI_PINNED__=1;\n")
              total_bytes += len("\nwindow.__FILM_AI_PINNED__=1;\n")
              ai_pin_re = re.compile(r'(<script src="film-ai/manifest\.js\?v=)([^"]+)("></script>)')
              ai_guard_re = re.compile(r"(async function updateLiveFilmAiManifest\(\)\{\s*)if\(!IS_GH_FILM\)return;")
              for f_rel in ("film.html", "影视参考图集.html"):
                  fp = site / f_rel
                  if fp.is_file():
                      fh = fp.read_text(encoding="utf-8")
                      old_sz = fp.stat().st_size
                      fh2, c_p = ai_pin_re.subn(lambda m: m.group(1) + ai_pin + m.group(3), fh, count=1)
                      assert c_p == 1, f"Expected 1 film-ai/manifest.js tag in {f_rel}, got {c_p}"
                      fh3, c_g = ai_guard_re.subn(r"\1if(!IS_GH_FILM||window.__FILM_AI_PINNED__)return;", fh2, count=1)
                      assert c_g == 1, f"Expected 1 updateLiveFilmAiManifest guard in {f_rel}, got {c_g}"
                      fp.write_text(fh3, encoding="utf-8", newline="\n")
                      total_bytes += fp.stat().st_size - old_sz
                      for st_attrs, sc in re.findall(r"<script([^>]*)>([\s\S]*?)</script>", fh3, re.I):
                          if not re.search(r"\bsrc\s*=", st_attrs, re.I) and sc.strip():
                              subprocess.run(["node", "--check", "-"], input=sc.encode("utf-8"), check=True)
              print(f"Pinned staged film pages to filtered film-ai/manifest.js {ai_pin} (single-fetch mode)")

          # Film cards load JPGs from GitHub Raw. Omit any newly validated JPEGs from Pages artifact.
          film_jpgs = list((site / "film-ai").rglob("*.jpg"))
          film_jpg_bytes = sum(image.stat().st_size for image in film_jpgs)
          for image in film_jpgs:
              image.unlink()
          total_bytes -= film_jpg_bytes
          print(f"Validated {len(film_jpgs)} uncached film JPGs ({film_jpg_bytes / 1048576:.2f} MiB); serving all film JPGs from GitHub Raw")
          max_site_bytes = 950 * 1024 * 1024
          assert total_bytes < max_site_bytes, f"_site exceeded 950 MiB safety threshold: {total_bytes / 1048576:.2f} MiB"

          if shots_manifest.exists():
              for rel in ("film.html", "影视参考图集.html"):
                  pins = shot_pin_re.findall((site / rel).read_text(encoding="utf-8"))
                  assert len(pins) == 1 and pins[0][1] == source_pin, rel

          (site / ".nojekyll").write_text("", encoding="utf-8")
          print(f"Staged {len(selected)} files into _site ({total_bytes / (1024*1024):.2f} MiB)")
          PY
          rm -rf repo
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
